[workspace]
resolver = "2"
members = [
    "crates/ainb-core",
    "crates/ainb-plugin-burndown",
    "crates/ainb-plugin-notifyd",
    "crates/ainb-plugin-protocol",
    "crates/ainb-plugin-runtime",
    "crates/ainb-plugin-sdk-rust",
    "crates/ainb-plugin-session-reader",
    "crates/ainb-plugin-testkit",
    "crates/ainb-plugin-types-sessions",
    "crates/ainb-plugin-cts-v2",
    "crates/ainb-plugin-witr",
    "xtask",
]
default-members = ["crates/ainb-core"]
# Phase 7c: burndown returns as a subprocess plugin (native binary,
# stdio JSON-RPC over the SDK). session-reader is being re-shipped in
# parallel under agents-in-a-box-4is.

[workspace.package]
version = "1.2.2"
edition = "2021"
authors = ["Agents-in-a-Box Team"]
license = "MIT"
repository = "https://github.com/stevengonsalvez/agents-in-a-box"

[workspace.dependencies]
# Core
tokio = { version = "1.36", features = ["full"] }
ratatui = "0.26"
crossterm = "0.27"

# Docker
bollard = "0.16"
futures-util = "0.3"
tar = "0.4"

# Tmux/PTY support
portable-pty = "0.8"

# Git operations (vendored-openssl for cross-compilation support)
git2 = { version = "0.18", features = ["vendored-openssl"] }

# Data persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"

# Claude API integration
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-stream = "0.3"
tokio-stream = "0.1"

# Utils
shell-escape = "0.1"
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
dirs = "5.0"
uuid = { version = "1.5", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
tempfile = "3.8"
nix = { version = "0.27", features = ["user", "signal"] }
arboard = "3.3"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
regex = "1.10"
lazy_static = "1.4"
which = "6.0"
url = "2.5"

# Markdown and syntax highlighting
pulldown-cmark = "0.9"
syntect = "5.0"
ansi-to-tui = "4"

# Persistent usage analytics cache
rusqlite = { version = "0.31", features = ["bundled", "blob"] }
blake3 = "1"
bincode = "1.3"

# Fuzzy search for the burndown zoom panels
nucleo-matcher = "0.3"

# File-locking for concurrent plugin install protection
fs2 = "0.4"

# Filesystem watch for fleet JSONL transcript tail
notify = "6.1"

# Dev / test
mockall = "0.12"
pretty_assertions = "1.4"
rexpect = "0.5"
vt100 = "0.15"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
