[workspace]
resolver = "2"
members = [
    "crates/ainb-core",
    "crates/ainb-fleet-core",
    "crates/ainb-web",
    "crates/ainb-plugin-burndown",
    "crates/ainb-plugin-learnings",
    "crates/ainb-plugin-notifyd",
    "crates/ainb-plugin-protocol",
    "crates/ainb-plugin-runtime",
    "crates/ainb-plugin-sdk-rust",
    "crates/ainb-plugin-session-reader",
    "crates/ainb-plugin-testkit",
    "crates/ainb-plugin-types-sessions",
    "crates/ainb-plugin-cts-v2",
    "crates/ainb-skill-core",
    "crates/ainb-fetch",
    "crates/ainb-adapters-source",
    "crates/ainb-adapters-tool",
    "crates/ainb-diff",
    "crates/ainb-cli",
    "crates/ainb-usage",
    "crates/ainb-plugin-witr",
    "crates/ainb-plugin-abtop",
    "crates/ainb-hangar-core",
    "crates/ainb-hangar-secrets",
    "crates/ainb-hangar-store",
    "crates/ainb-hangar-proto",
    "crates/ainb-hangar-sandbox",
    "crates/ainb-hangar-daemon",
    "crates/ainb-plugin-hangar",
    "xtask",
]
default-members = ["crates/ainb-core"]
# Phase 7c: burndown returns as a subprocess plugin (native binary,
# stdio JSON-RPC over the SDK). session-reader is being re-shipped in
# parallel under agents-in-a-box-4is.

[workspace.package]
version = "1.12.0"
edition = "2021"
authors = ["Agents-in-a-Box Team"]
license = "MIT"
repository = "https://github.com/stevengonsalvez/agents-in-a-box"

[workspace.dependencies]
# Core
tokio = { version = "1.36", features = ["full"] }
# CancellationToken for cooperative shutdown of the daemon's poll loops
# (ainb-hangar-daemon inbound beads sync, P2.4). The default `sync` feature
# carries `CancellationToken`.
tokio-util = "0.7"
ratatui = "0.30"
crossterm = "0.29"

# Docker
bollard = "0.16"
futures-util = "0.3"
tar = "0.4"

# Tmux/PTY support
portable-pty = "0.9"
vt100 = "0.16"
tui-term = "0.3.4"

# Git operations (vendored-openssl for cross-compilation support)
git2 = { version = "0.18", features = ["vendored-openssl"] }

# Data persistence
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
serde_yaml_ng = "0.10"
toml = "0.8"
toml_edit = "0.22"

# Claude API integration
reqwest = { version = "0.11", default-features = false, features = ["json", "stream", "rustls-tls"] }
async-stream = "0.3"
tokio-stream = "0.1"
# Slack socket-mode WebSocket transport for the native phone bridge
# (`ainb fleet bridge`). rustls-only (no OpenSSL) to match reqwest above and
# keep the single-binary build cross-compilable.
tokio-tungstenite = { version = "0.21", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }

# Utils
shell-escape = "0.1"
anyhow = "1.0"
thiserror = "1.0"
directories = "5.0"
dirs = "5.0"
uuid = { version = "1.5", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.4", features = ["derive"] }
clap_complete = "4.4"
tempfile = "3.8"
nix = { version = "0.27", features = ["user", "signal"] }
# Process-identity cross-check for the Daemons liveness probe: a bare
# `kill(pid,0)` can't tell a live daemon from a recycled pid, so we read the
# live process's real start time and match it against the heartbeat's
# `started_at`. Portable across macOS (kinfo_proc) and Linux (/proc/<pid>/stat);
# `system` feature only (no disk/network/component collectors).
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
arboard = "3.3"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
regex = "1.10"
lazy_static = "1.4"
which = "6.0"
url = "2.5"
# Task lifecycle FSM (T8): typed compile-time hierarchical state machine for the
# `agent_task_queue` in-process transitions the hangar daemon drives
# (dispatched -> running -> done|failed). Types the transition *ordering* in
# process; the migration-0012 SQL claim guard stays the DB-level enforcer.
statig = "0.4"

# Markdown and syntax highlighting
pulldown-cmark = "0.9"
syntect = "5.2"
ansi-to-tui = "8.0.1"
# Code Review diff surface: structured + word-level diff (similar),
# Dracula theme + extra grammars (two-face). syntect→ratatui span conversion
# is inlined.
similar = { version = "2", features = ["inline"] }
two-face = "0.5"
# TRANSITIVE VERSION CAP, not a real dependency: time 0.3.48 (released
# 2026-06-11/12) fails to compile against this graph — E0119 "conflicting
# implementations of From<HourBase>" the moment ratatui-core's blanket impls
# are in scope (reproduced locally AND the cause of every red CI run since
# 2026-06-11; no Cargo.lock is tracked, so CI always resolves the latest).
# time reaches us via syntect→plist and ratatui-widgets. Remove this cap when
# a fixed time release (>0.3.48) compiles: `cargo update -p time` + build.
time = ">=0.3.36, <0.3.48"

# Persistent usage analytics cache
# Bumped 0.31 -> 0.32 so `libsqlite3-sys` (links = "sqlite3") resolves to a
# single 0.30.1 copy shared with sqlx-sqlite 0.8 in ainb-hangar-store. Two
# crates linking different libsqlite3-sys majors is a hard `links` collision.
rusqlite = { version = "0.32", features = ["bundled", "blob"] }
blake3 = "1"
bincode = "1.3"

# Fuzzy search for the burndown zoom panels
nucleo-matcher = "0.3"

# File-locking for concurrent plugin install protection
fs2 = "0.4"

# Filesystem watch for fleet JSONL transcript tail
notify = "6.1"

# Web dashboard (`ainb web` / ainb-web crate): axum HTTP + SSE, tower
# middleware, and rust-embed for the no-build-step vanilla-JS frontend.
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
rust-embed = { version = "8", features = ["mime-guess"] }
mime_guess = "2"
subtle = "2.6"

# Dev / test
mockall = "0.12"
pretty_assertions = "1.4"
rexpect = "0.5"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
