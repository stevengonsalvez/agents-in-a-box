[package]
name = "ainb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-based development environment manager for Claude Code containers"
keywords = ["claude", "docker", "tui", "development", "containers"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ainb"
path = "src/main.rs"

[lib]
name = "ainb"
path = "src/lib.rs"

[dependencies]
# Core
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

# Docker
bollard = { workspace = true }
futures-util = { workspace = true }
tar = { workspace = true }

# Tmux/PTY support
portable-pty = { workspace = true }

# Git operations
git2 = { workspace = true }

# Data persistence
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_bytes = "0.11"
toml = { workspace = true }
rmp-serde = "1.3"

# Claude API integration
reqwest = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }

# Utils
shell-escape = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tempfile = { workspace = true }
nix = { workspace = true }
arboard = { workspace = true }
keyring = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
which = { workspace = true }
url = { workspace = true }

# Markdown and syntax highlighting
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
ansi-to-tui = { workspace = true }

# Persistent usage analytics cache
rusqlite = { workspace = true }
blake3 = { workspace = true }
bincode = { workspace = true }

# Plugin host (Phase 3 Wave 3 wiring — loads bundled burndown.wasm at startup)
ainb-plugin-api = { path = "../ainb-plugin-api", version = "0.1.0" }
ainb-plugin-host = { path = "../ainb-plugin-host", version = "0.1.0" }

# Fuzzy search
nucleo-matcher = { workspace = true }

[features]
default = []
visual-debug = []
vt100-tests = []
# Exposes shared test fixtures (test_support module) so integration
# tests in tests/ can use them. Always enabled under #[cfg(test)] for
# unit tests; integration tests must opt in via this feature.
test-support = []
# Phase 6c-cli CLI integration tests: spawn the release `ainb`
# binary as a subprocess and assert exit codes + stdout/stderr
# against the burndown plugin pipeline. Gated because the tests
# require both `dist/plugins/burndown/plugin.wasm` and
# `dist/plugins/session-reader/plugin.wasm` on disk.
cli-tests = ["test-support"]
# Phase 6e tmux end-to-end gate: drive the actual TUI inside a real
# tmux session, navigate to Analytics, capture the rendered pane,
# and assert the burndown plugin painted real data through the
# wasmi -> ratatui -> crossterm stack. Opt-in because it requires
# `tmux` on PATH and the dist plugin staging dir, and is meant as a
# pre-merge local gate rather than a default CI check (per memory
# `feedback_plugin_completion_real_tmux_integration`).
tmux-tests = ["cli-tests"]

[dev-dependencies]
mockall = { workspace = true }
pretty_assertions = { workspace = true }
rexpect = { workspace = true }
vt100 = { workspace = true }
insta = { version = "1.40", features = ["json"] }

[lints]
workspace = true
