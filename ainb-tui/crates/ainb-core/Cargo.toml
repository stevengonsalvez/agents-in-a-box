[package]
name = "ainb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-based development environment manager for Claude Code containers"
keywords = ["claude", "docker", "tui", "development", "containers"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ainb"
path = "src/main.rs"

[lib]
name = "ainb"
path = "src/lib.rs"

[dependencies]
# Core
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

# Docker
bollard = { workspace = true }
futures-util = { workspace = true }
tar = { workspace = true }

# Tmux/PTY support
portable-pty = { workspace = true }

# Git operations
git2 = { workspace = true }

# Data persistence
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde_bytes = "0.11"
toml = { workspace = true }
rmp-serde = "1.3"

# Claude API integration
reqwest = { workspace = true }
async-stream = { workspace = true }
tokio-stream = { workspace = true }

# Utils
shell-escape = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
directories = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tempfile = { workspace = true }
nix = { workspace = true }
arboard = { workspace = true }
keyring = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
which = { workspace = true }
url = { workspace = true }

# Markdown and syntax highlighting
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
ansi-to-tui = { workspace = true }

# Persistent usage analytics cache
rusqlite = { workspace = true }
blake3 = { workspace = true }
bincode = { workspace = true }

# Plugin runtime (Phase 7 — subprocess + JSON-RPC, replaces wasmi host).
ainb-plugin-runtime = { path = "../ainb-plugin-runtime", version = "0.1.0" }
ainb-plugin-protocol = { path = "../ainb-plugin-protocol", version = "0.1.0" }

# Skill manager CLI surface (source/search/skill/migrate/doctor — spec §10.1).
ainb-cli = { path = "../ainb-cli", version = "0.1.0" }
# Manifest + URI types — needed by the SkillManager screen's discovery
# banner (spec §User Flow 1 / P5) to load + write `manifest.yaml`.
ainb-skill-core = { path = "../ainb-skill-core", version = "0.1.0" }
# Zero-copy byte buffers — required for `RuntimeHandle::publish_snapshot`'s
# `payload: bytes::Bytes` parameter, used by the Phase 7c CLI dispatcher.
bytes = "1.6"

# Fuzzy search
nucleo-matcher = { workspace = true }

[features]
default = []
visual-debug = []
vt100-tests = []
# Exposes shared test fixtures (test_support module) so integration
# tests in tests/ can use them. Always enabled under #[cfg(test)] for
# unit tests; integration tests must opt in via this feature.
test-support = []
# CLI integration tests opt-in flag. The Phase 6c burndown/session-reader
# subprocess assertions died with the wasmi removal in Phase 7b; the flag
# stays so Phase 7c can hang the new CTS-driven gates off it without a
# Cargo.toml round-trip.
cli-tests = ["test-support"]
# Tmux end-to-end opt-in. Same status as cli-tests — the burndown E2E
# binding was deleted in Phase 7b; new subprocess-plugin tmux gates land
# in Phase 7c.
tmux-tests = ["cli-tests"]

[dev-dependencies]
mockall = { workspace = true }
pretty_assertions = { workspace = true }
rexpect = { workspace = true }
vt100 = { workspace = true }
insta = { version = "1.40", features = ["json"] }
bytes = "1.6"

[lints]
workspace = true
