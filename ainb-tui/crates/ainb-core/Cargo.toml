[package]
name = "ainb"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Terminal-based development environment manager for Claude Code containers"
keywords = ["claude", "docker", "tui", "development", "containers"]
categories = ["command-line-utilities", "development-tools"]

# `time` is intentionally unused in code — it exists only to cap the
# transitive version below the broken 0.3.48 release (see the workspace
# manifest comment).
[package.metadata.cargo-machete]
ignored = ["time"]

[[bin]]
name = "ainb"
path = "src/main.rs"

[lib]
name = "ainb"
path = "src/lib.rs"

[dependencies]
# Core
tokio = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

# Docker
bollard = { workspace = true }
futures-util = { workspace = true }
tar = { workspace = true }

# Tmux/PTY support
portable-pty = { workspace = true }
vt100 = { workspace = true }
tui-term = { workspace = true }

# Git operations
git2 = { workspace = true }

# Data persistence
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

# Claude API integration
reqwest = { workspace = true }
tokio-stream = { workspace = true }

# Utils
shell-escape = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tempfile = { workspace = true }
nix = { workspace = true }
arboard = { workspace = true }
keyring = { workspace = true }
regex = { workspace = true }
lazy_static = { workspace = true }
which = { workspace = true }
url = { workspace = true }

# Markdown and syntax highlighting
pulldown-cmark = { workspace = true }
syntect = { workspace = true }
ansi-to-tui = { workspace = true }
# Code Review diff surface
similar = { workspace = true }
two-face = { workspace = true }
# Version cap only (no code uses it directly) — pins the TRANSITIVE time
# crate below the broken 0.3.48 release. See the workspace manifest comment
# for the E0119 story + removal condition.
time = { workspace = true }

# Persistent usage analytics cache
rusqlite = { workspace = true }
blake3 = { workspace = true }
bincode = { workspace = true }

# Plugin runtime (Phase 7 — subprocess + JSON-RPC, replaces wasmi host).
ainb-plugin-runtime = { path = "../ainb-plugin-runtime", version = "0.1.0" }
ainb-plugin-protocol = { path = "../ainb-plugin-protocol", version = "0.1.0" }
# Notification daemon — used in-process for the Inbox screen reader.
ainb-plugin-notifyd = { path = "../ainb-plugin-notifyd", version = "1.1.0" }
# Read-only web dashboard — backs the `ainb web` subcommand.
ainb-web = { path = "../ainb-web", version = "1.7.0" }
# CSPRNG for `ainb hangar auth token create` (the OsRng passed to the store's
# `mint_pat` / `mint_daemon_token`). All hashing/encoding lives in the store +
# core; the CLI only supplies the random source.
rand = "0.8"
# Hangar control plane — backs the `ainb hangar <verb>` CLI namespace.
ainb-hangar-core = { path = "../ainb-hangar-core", version = "0.1.0" }
ainb-hangar-store = { path = "../ainb-hangar-store", version = "0.1.0" }
ainb-hangar-daemon = { path = "../ainb-hangar-daemon", version = "0.1.0" }
# sqlx — the hangar CLI workspace-bootstrap path issues raw SQL against the
# store's pool (`Store::pool`) for the default-workspace seed and lookups.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "sqlite",
    "macros",
] }
# Zero-copy byte buffers — required for `RuntimeHandle::publish_snapshot`'s
# `payload: bytes::Bytes` parameter, used by the Phase 7c CLI dispatcher.
bytes = "1.6"

# Fleet — filesystem watch for JSONL transcript tail (assistant-turn detection).
notify = { workspace = true }

[features]
default = []
visual-debug = []
vt100-tests = []
# Exposes shared test fixtures (test_support module) so integration
# tests in tests/ can use them. Always enabled under #[cfg(test)] for
# unit tests; integration tests must opt in via this feature.
test-support = []
# CLI integration tests opt-in flag. The Phase 6c burndown/session-reader
# subprocess assertions died with the wasmi removal in Phase 7b; the flag
# stays so Phase 7c can hang the new CTS-driven gates off it without a
# Cargo.toml round-trip.
cli-tests = ["test-support"]
# Tmux end-to-end opt-in. Same status as cli-tests — the burndown E2E
# binding was deleted in Phase 7b; new subprocess-plugin tmux gates land
# in Phase 7c.
tmux-tests = ["cli-tests"]

[dev-dependencies]
mockall = { workspace = true }
pretty_assertions = { workspace = true }
rexpect = { workspace = true }
proptest = { workspace = true }
insta = { version = "1.40", features = ["json"] }
bytes = "1.6"

[lints]
workspace = true
