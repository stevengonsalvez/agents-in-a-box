[package]
name = "ainb-hangar-secrets"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hangar OS keychain bridge: a read/write SecretBackend abstraction over the macOS Keychain (security-framework), a Linux Secret Service stub, and an in-memory test double; secret bytes zeroize on drop"
categories = ["authentication", "os"]
keywords = ["ainb", "hangar", "keychain", "secrets", "security-framework"]

[lib]
name = "ainb_hangar_secrets"
path = "src/lib.rs"

[dependencies]
ainb-hangar-core = { path = "../ainb-hangar-core" }
thiserror = { workspace = true }
zeroize = { version = "1", features = ["derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "2"

[features]
# Exposes the in-memory backend (`InMemoryBackend`) to downstream crates' test
# builds. Within this crate it is also available under `#[cfg(test)]` without
# enabling the feature. Integration tests (a separate crate) enable it via the
# `default` dev build, see the `[dev-dependencies]`-driven default below.
test-backend = []

[dev-dependencies]
# `zeroize` is a normal dependency, but the zeroize-on-drop assertion in the
# integration tests imports the `Zeroize` trait directly.
zeroize = { version = "1", features = ["derive"] }
# Self dev-dependency with `test-backend` enabled: this is the idiomatic way to
# make the cfg-gated `InMemoryBackend` visible to the integration tests (a
# separate compilation unit that does NOT inherit the lib's `#[cfg(test)]`),
# WITHOUT shipping the in-memory backend in the release `cdylib`/`rlib`. Plain
# `cargo test -p ainb-hangar-secrets` now compiles the tests with the feature on.
ainb-hangar-secrets = { path = ".", features = ["test-backend"] }

# Local lint config rather than `workspace = true`: mirrors the sibling
# ainb-hangar-core / ainb-hangar-store crates. The workspace-level lints would
# declare lint groups at the same priority as specific lints, which rustc
# rejects; keeping the intent local keeps
# `cargo clippy -p ainb-hangar-secrets --all-targets -- -D warnings` clean.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
