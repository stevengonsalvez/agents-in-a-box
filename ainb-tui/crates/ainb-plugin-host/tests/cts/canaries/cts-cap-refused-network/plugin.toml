[plugin]
name = "cts-2a91f0b2-cap-refused-network"
version = "0.0.1"
ainb_min_version = "1.0.0"
description = "CTS canary: imports ainb_http_request without declaring network capability."

# Deliberately omits the `network` allowlist. The host must not link
# `ainb_http_request` for this manifest, so wasmi rejects the module at
# instantiation with an unresolved-import error. This is the
# "refused statically" property — there is no runtime trap path; the
# plugin never gets to call the function.
[capabilities]
write_plugin_data = true

[provides]
