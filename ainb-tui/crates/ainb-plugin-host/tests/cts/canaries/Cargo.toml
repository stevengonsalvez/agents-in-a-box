[workspace]
resolver = "2"
members = [
    "cts-minimal-screen",
    "cts-cap-refused-network",
    "cts-panics-on-init",
    "cts-panics-on-render",
    "cts-wrong-min-version",
    "cts-pair-a",
    "cts-pair-b",
    "cts-sidebar-only",
    "cts-statusline-only",
    "cts-command-only",
    "cts-provider-only",
    "cts-infinite-tick",
    "cts-malformed-buffer",
]

# Canaries are size-tuned: panic = abort drops the unwinding machinery
# (cdylib doesn't support unwinding anyway), opt-level = "z" + lto keeps
# .wasm artifacts under a few hundred bytes — fast to compile + load.

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
