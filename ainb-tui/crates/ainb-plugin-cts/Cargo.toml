[package]
name = "ainb-plugin-cts"
version = "1.0.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformance Test Suite for ainb plugins — run_contract_v1(wasm) returns a ConformanceReport asserting your plugin honours the v1 spec."
readme = "README.md"
keywords = ["wasm", "plugin", "conformance", "ainb"]
categories = ["wasm", "development-tools::testing"]
# `include` ships the v1 spec alongside the crate so `run_contract_v1`
# is self-contained: no need for the caller to vendor contract.toml.
include = [
    "src/**",
    "spec/**",
    "README.md",
    "Cargo.toml",
]

[lib]
name = "ainb_plugin_cts"
path = "src/lib.rs"

[dependencies]
ainb-plugin-api = { path = "../ainb-plugin-api", version = "0.1" }
wasmi = "0.40"
serde = { workspace = true }
toml = { workspace = true }
anyhow = { workspace = true }
rmp-serde = "1.3"
semver = "1.0"

[lints]
workspace = true
