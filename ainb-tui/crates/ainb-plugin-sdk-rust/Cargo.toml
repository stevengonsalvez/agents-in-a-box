[package]
name = "ainb-plugin-sdk-rust"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Rust SDK for ainb plugins. Implements the Plugin trait + stdio JSON-RPC server + reverse-call host_client."
categories = ["development-tools"]
keywords = ["ainb", "plugin", "sdk", "json-rpc"]

[lib]
name = "ainb_plugin_sdk"
path = "src/lib.rs"

[dependencies]
ainb-plugin-protocol = { path = "../ainb-plugin-protocol" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = { version = "1.6", features = ["serde"] }
thiserror = { workspace = true }
async-trait = "0.1"
tracing = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

# Local lints — workspace lints declare lint groups at the same priority as
# specific lints, which rustc rejects. Mirror intent locally so this crate
# passes `cargo clippy -p ainb-plugin-sdk-rust -- -D warnings`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
