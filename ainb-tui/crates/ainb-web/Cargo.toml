[package]
name = "ainb-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Read-only, SSE-live web dashboard for the ainb agent fleet (sessions + fleet needs + cost)"

[lib]
name = "ainb_web"
path = "src/lib.rs"

[dependencies]
# `ws` adds the WebSocket extractor for the live terminal bridge.
axum = { workspace = true, features = ["ws"] }
tower = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
subtle = { workspace = true }
dirs = { workspace = true }

tokio = { workspace = true }
# `sync` brings in BroadcastStream for the SSE fan-out.
tokio-stream = { workspace = true, features = ["sync"] }
futures-util = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# The daemon control plane (D18): the web surface reads `attention/list` and
# routes answers through `attention/answer` over the hangar unix socket. These
# are the PURE wire crates (no host/IO deps) — the socket dial + framing live in
# `daemon.rs` here, the shapes come from the shared proto.
ainb-hangar-proto = { path = "../ainb-hangar-proto", version = "0.1.0" }
ainb-hangar-core = { path = "../ainb-hangar-core", version = "0.1.0" }

# Live tmux terminal bridge: a real `tmux attach-session` PTY whose raw bytes
# stream to xterm.js in the browser (mirrors agent-deck's tmuxPTYBridge).
portable-pty = { workspace = true }

# Web-push (VAPID): `hyper-client` avoids the libcurl/isahc default. Keypair
# generation is done with p256 (the crate signs but does not generate keys).
web-push = { version = "0.11", default-features = false, features = ["hyper-client"] }
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.8"
base64ct = { version = "1", features = ["alloc"] }

[dev-dependencies]
tempfile = { workspace = true }
# `util` brings ServiceExt::oneshot for driving the router in route tests.
tower = { workspace = true, features = ["util"] }
serde_json = { workspace = true }
# `test-util` brings tokio::time::{pause,advance} for deterministic poller tests.
tokio = { workspace = true, features = ["test-util"] }
# Real WebSocket client for the terminal-upgrade integration test (oneshot
# can't drive a 101 upgrade — it never reaches hyper's connection layer).
tokio-tungstenite = "0.21"
futures-util = { workspace = true }
