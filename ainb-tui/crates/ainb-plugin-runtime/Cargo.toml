[package]
name = "ainb-plugin-runtime"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Host-side plugin runtime: subprocess spawn, JSON-RPC over stdio, snapshot/action bus, lifecycle FSM"
categories = ["development-tools"]
keywords = ["ainb", "plugin", "json-rpc", "runtime"]

[lib]
name = "ainb_plugin_runtime"
path = "src/lib.rs"

[dependencies]
ainb-plugin-protocol = { path = "../ainb-plugin-protocol" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { version = "1.6", features = ["serde"] }
parking_lot = "0.12"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
ainb-plugin-protocol = { path = "../ainb-plugin-protocol" }

[[bin]]
name = "ainb-fixture-plugin"
path = "tests/fixtures/fixture_plugin.rs"
test = false
doc = false
required-features = []

[[bin]]
name = "ainb-slow-fixture-plugin"
path = "tests/fixtures/slow_fixture_plugin.rs"
test = false
doc = false
required-features = []

[[test]]
name = "fixture_e2e"
path = "tests/fixture_e2e.rs"

[lints.rust]
unsafe_code = "allow"  # PR_SET_PDEATHSIG / setpgid require unsafe libc calls
missing_docs = "allow"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"

[lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
style = { level = "allow", priority = -1 }
complexity = { level = "allow", priority = -1 }
perf = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
# `Duration::from_mins` isn't stable on the Rust we target; keep the
# explicit `from_secs` form so the workspace builds on older toolchains.
duration_suboptimal_units = "allow"
