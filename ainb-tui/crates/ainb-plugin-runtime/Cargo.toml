[package]
name = "ainb-plugin-runtime"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host-side plugin runtime: subprocess spawn, JSON-RPC over stdio, snapshot/action bus, lifecycle FSM"
categories = ["development-tools"]
keywords = ["ainb", "plugin", "json-rpc", "runtime"]

[lib]
name = "ainb_plugin_runtime"
path = "src/lib.rs"

[dependencies]
ainb-plugin-protocol = { path = "../ainb-plugin-protocol" }
# Platform secret store backend for `host/secret_store_get` (P5.2). The crate
# owns the per-platform split internally (macOS Keychain via security-framework,
# linux Secret Service stub returning NotImplemented), so the runtime takes it
# unconditionally and injects a `SecretBackend` trait object via DI.
ainb-hangar-secrets = { path = "../ainb-hangar-secrets" }
ainb-hangar-core = { path = "../ainb-hangar-core" }

tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
bytes = { version = "1.6", features = ["serde"] }
parking_lot = "0.12"
ulid = "1"
base64 = "0.22"
# Resolve the user home for the default `state.toml` path (P5.5 workspace store).
dirs = { workspace = true }
# Wire event type (`HangarEvent::WorkspaceChanged`) broadcast on a workspace
# switch so subscribed plugins re-fetch. Pure wire types, no host deps.
ainb-hangar-proto = { path = "../ainb-hangar-proto" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
ainb-plugin-protocol = { path = "../ainb-plugin-protocol" }
# In-memory `SecretBackend` double so the P5.2 handler tests can seed and read
# secrets without touching the platform keychain.
ainb-hangar-secrets = { path = "../ainb-hangar-secrets", features = ["test-backend"] }

[[bin]]
name = "ainb-fixture-plugin"
path = "tests/fixtures/fixture_plugin.rs"
test = false
doc = false
required-features = []

[[bin]]
name = "ainb-slow-fixture-plugin"
path = "tests/fixtures/slow_fixture_plugin.rs"
test = false
doc = false
required-features = []

[[test]]
name = "fixture_e2e"
path = "tests/fixture_e2e.rs"

[lints.rust]
unsafe_code = "allow"  # PR_SET_PDEATHSIG / setpgid require unsafe libc calls
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
significant_drop_tightening = "allow"
significant_drop_in_scrutinee = "allow"
# `Duration::from_mins` isn't stable on the Rust we target; keep the
# explicit `from_secs` form so the workspace builds on older toolchains.
duration_suboptimal_units = "allow"
