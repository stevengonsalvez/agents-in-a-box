# Standalone sub-workspace: this crate targets wasm32-wasip1 only.
# Excluded from the parent workspace at ../../Cargo.toml so root
# `cargo build`/`cargo test` (host target) doesn't try to compile it.
[workspace]

[package]
name = "ainb-plugin-burndown"
version = "0.1.0"
edition = "2021"
authors = ["stevengonsalvez"]
license = "MIT"
description = "Burndown / usage analytics plugin for ainb (wasm32-wasip1 cdylib)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Plugin SDK — manifest, capability, and wire types only (no host deps).
ainb-plugin-api = { path = "../ainb-plugin-api" }

# Data model + cache + reports
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rmp-serde = "1.3"
rusqlite = { version = "0.31", features = ["bundled"] }
blake3 = "1.5"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
bincode = "1.3"
dirs = "5.0"

# UI: ratatui without termion/crossterm backends — we paint into a Buffer
# and the host translates to a WireBuffer for compositing.
ratatui = { version = "0.26", default-features = false }

[profile.release]
# Trim wasm size — Phase 3 acceptance ceiling is < 5 MB.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
