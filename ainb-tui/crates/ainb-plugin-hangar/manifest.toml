# ainb plugin manifest — hangar-tui (subprocess plugin, ABI v2).
#
# Loaded by ainb-plugin-runtime at host startup (discovery) and again at
# plugin/init for validation. Schema lives in
# `ainb-plugin-protocol::manifest::Manifest` — keep field names in sync
# with that type.
#
# Hangar is ainb's TUI-first managed-agents control plane. This manifest
# declares the four host caps (event_stream_subscribe,
# spawn_managed_subprocess, unix_socket_dial, secrets:read). The
# secrets:read handler is fully wired in P5.2 (scope/key addressing,
# backed by the platform keychain via ainb-hangar-secrets).

[plugin]
name = "hangar-tui"
version = "0.1.0"
abi_version = 2
description = "Hangar control plane TUI"

[capabilities]
# Streaming subscriptions: workspace events from the daemon, managed
# subprocess stdout, and the cap-mediated socket stream. List form is a
# topic-prefix allow-list.
event_stream_subscribe = ["workspace:*", "stream:*", "managed:*", "socket:*"]
# Host-supervised spawn of the hangar daemon on first run. List form is
# mandatory — a bool-true grant is rejected at manifest validation.
spawn_managed_subprocess = ["ainb-hangar-daemon"]
# Dial exactly the hangar daemon socket. List form is mandatory; the host
# canonicalizes + symlink-resolves the path before comparing. The daemon binds
# under the resolved Hangar home, so the socket MOVES when $AINB_HANGAR_HOME is
# set — the `${AINB_HANGAR_HOME}/hangar.sock` entry covers that case (the host
# expands `${VAR}`), and is harmless when the var is unset (it then expands to
# `/hangar.sock`, which never matches the real `~/.agents-in-a-box` dial).
unix_socket_dial = ["~/.agents-in-a-box/hangar.sock", "${AINB_HANGAR_HOME}/hangar.sock", "${XDG_RUNTIME_DIR}/ainb-hangar.sock"]
# Read provider API keys from the platform secret store. List form is the
# allow-list of secret `key` names (per-scope; see host/secret_store_get).
"secrets:read" = ["anthropic_api_key", "openai_api_key"]
# Switch / default the active workspace from the Settings Workspace pane
# (host/workspace_set_active, host/workspace_set_default). Bool-true grants
# the write for any workspace; the read caps (list / get_active) are ungated.
"workspace:write" = true
# Snapshot/event bus, narrowed to the topics this plugin uses (#1038 review):
# the agent-status envelope the TUI host publishes (every agent's cwd and
# pending tool input, so no plugin gets it by a blanket grant), its own
# `ui.state` view, and the panel close request. An entry ending in `*` is a
# prefix; any other entry is one exact topic.
event_bus = ["fleet.agent_status", "ui.state*", "ui.close_request"]
# Plugin-local data dir.
write_plugin_data = true

[provides]
screens = ["hangar"]
commands = ["/hangar"]
cli_namespaces = ["hangar"]
snapshots = []

[subscribes]
# The agent-status envelope the TUI host publishes; the Fleet panel renders
# from it and reads no Fleet status of its own (#1031).
#
# Lifecycle consequence (#1038 review): the runtime never idle-reaps a plugin
# that declares a snapshot subscription (`maybe_idle_reap` in
# ainb-plugin-runtime's plugin_task.rs), so once this plugin spawns (lazily, on
# first use) it lives for the rest of the TUI session, holding its daemon
# socket and its `secrets:read` grant, instead of being reaped after the
# runtime's idle window. That is what keeps the panel current: an envelope
# published while the plugin is reaped would be dropped, and only the latest
# one is kept for its next `snapshot_get`.
snapshots = ["fleet.agent_status"]

[lifecycle]
spawn = "lazy"
idle_reap_secs = 0
