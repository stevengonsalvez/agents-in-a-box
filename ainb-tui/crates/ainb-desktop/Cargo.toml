[package]
name = "ainb-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "ainb desktop shell: a Tauri v2 host of the ainb-app state machine"
license = "MIT"

# Its own workspace, excluded from the parent's `members`: the parent's
# `--all-features` Test job never builds Tauri or needs webkit2gtk.
[workspace]

[lib]
name = "ainb_desktop"
path = "src/lib.rs"

# The window needs Tauri and the platform webview; the host, the executor and
# the sidecar supervisor do not, so their tests build without either.
[[bin]]
name = "ainb-desktop"
path = "src/main.rs"
required-features = ["app"]

[features]
default = []
app = ["dep:tauri", "dep:tauri-build"]

[dependencies]
ainb-app = { path = "../ainb-app" }
ainb-hangar-client = { path = "../ainb-hangar-client" }
ainb-hangar-proto = { path = "../ainb-hangar-proto" }
arboard = "3.6"
nix = { version = "0.29", features = ["fs", "process", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.36", features = ["full"] }
tracing = "0.1"
tauri = { version = "~2.11.5", optional = true }

[build-dependencies]
tauri-build = { version = "~2.6.3", optional = true }

[dev-dependencies]
tempfile = "3"
