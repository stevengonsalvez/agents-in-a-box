# ainb plugin manifest — session-reader.
#
# Phase 6b data plane plugin: walks Claude/Codex/Gemini/Copilot session
# files and publishes a single combined `sessions.usage_data` event for
# downstream consumers (burndown TUI/CLI in Phase 6c).
#
# This plugin has no UI surface and no CLI namespace — it is pure data.

[plugin]
name = "session-reader"
version = "0.1.0"
ainb_min_version = "1.2.0"
description = "Walks per-provider session logs and publishes sessions.usage_data"
author = "stevengonsalvez"
license = "MIT"

[capabilities]
# Read raw Claude / Codex JSONL session histories. Triggers the host's
# Phase 6 fs allowlist (~/.claude/projects + ~/.codex/sessions).
read_claude_logs    = true
read_codex_logs     = true
# event_bus: publish + subscribe for the host's pub/sub plus the
# request_data sync RPC the CLI path uses in Phase 6c-cli.
event_bus           = true
# Cache the parsed snapshot under the plugin's own cache dir.
write_plugin_data   = true
# No network. No subprocess.
network             = []
spawn_subprocess    = false

[provides]
# No UI. No CLI namespace. Pure data plane.

[paths]
# $HOME expansion happens host-side. Each entry is optional; the host
# falls back to its built-in default if a field is absent. Override
# here when the user keeps logs in a non-standard location.
claude_projects  = "$HOME/.claude/projects"
codex_sessions   = "$HOME/.codex/sessions"
gemini_sessions  = "$HOME/.gemini/sessions"
copilot_sessions = "$HOME/.config/github-copilot/sessions"
