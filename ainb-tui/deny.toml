# cargo-deny configuration for ainb-tui
# Run: cargo deny check
# Docs: https://embarkstudios.github.io/cargo-deny/

# ──────────────────────────────────────────────────────────────────────────────
# Advisories — check for known security vulnerabilities (RustSec)
# ──────────────────────────────────────────────────────────────────────────────
[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = []

# ──────────────────────────────────────────────────────────────────────────────
# Licenses — allow-list for acceptable open-source licenses
# ──────────────────────────────────────────────────────────────────────────────
[licenses]
unlicensed = "deny"
copyleft = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OpenSSL",
    "BSL-1.0",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

# ──────────────────────────────────────────────────────────────────────────────
# Bans — deny or allow specific crates, detect duplicates
# ──────────────────────────────────────────────────────────────────────────────
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

deny = []
skip = []
skip-tree = []

# ──────────────────────────────────────────────────────────────────────────────
# Sources — restrict where crates can be fetched from
# ──────────────────────────────────────────────────────────────────────────────
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
