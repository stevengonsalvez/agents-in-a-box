# agents-in-a-box Configuration
# ==============================
# Copy this file to: ~/.agents-in-a-box/config/config.toml
#
# Configuration is read from four locations. `ainb config path` prints them
# with a mark against the ones that exist:
#   ./.ainb/config.toml                    (project-level)
#   ./.agents-box/config.toml              (project-level, legacy name)
#   ~/.agents-in-a-box/config/config.toml  (user-level)
#   /etc/agents-in-a-box/config.toml       (system-level)
#
# KNOWN ISSUE: which one wins is currently the reverse of what you would
# expect — the system file overrides the user's, which overrides a project's.
# Fixing the order alone is unsafe today, because merging a layer also resets
# a few fields it does not mention, so a small project file would silently
# clear settings from your user config. Both are being fixed together; until
# then, prefer keeping settings in ONE of these files.

version = "0.1.0"

# =============================================================================
# General
# =============================================================================
# --8<-- parse
# [general]
# ## Colourise fenced code blocks in agent output. NO_COLOR still wins over
# ## this and over AGENTS_BOX_SYNTAX_HIGHLIGHT.
# syntax_highlight = true
#
# ## Install skills into each tool's real config dir (~/.claude, ~/.codex, ...)
# ## rather than ainb's managed sandbox. True is the shipped behaviour: an
# ## installed skill has to be where the tool actually looks.
# skill_install_real_homes = true
# -->8--
#
# The AINB_HOME env var still relocates ainb's state directory and is unchanged.
# It has deliberately NOT been promoted to a config key: its readers disagree
# about whether it names the state directory itself or its parent, so a key here
# would have to pick one and silently scatter the other's files.

# =============================================================================
# Authentication
# =============================================================================
[authentication]
# Active CLI provider for agent sessions
# Options: "claude" | "codex" | "gemini" | "copilot"
cli_provider = "claude"

# Claude-specific authentication provider
# Options: "system_auth" | "api_key" | "amazon_bedrock" | "google_vertex"
#          | "azure_foundry" | "glm_zai" | "llm_gateway"
claude_provider = "system_auth"

# Default Claude model to use (only applies when cli_provider = "claude")
# Options: "opus" | "sonnet" | "haiku"
default_model = "sonnet"

# GitHub authentication method (reserved for future use)
# github_method = "oauth"

# -----------------------------------------------------------------------------
# API Keys
# -----------------------------------------------------------------------------
# API keys are stored securely in your system keychain, not in this file.
# Use the TUI auth setup (press 'a' on home screen) to configure keys.
#
# Environment variables (for CI/automation):
#   - Claude:  ANTHROPIC_API_KEY
#   - Codex:   OPENAI_API_KEY
#   - Gemini:  GEMINI_API_KEY

# =============================================================================
# Docker
# =============================================================================
[docker]
# Custom Docker host connection string (optional)
# If not specified, auto-detects: Docker Desktop, Colima, WSL2, etc.
# Examples:
#   - Unix socket: "unix:///var/run/docker.sock"
#   - TCP: "tcp://localhost:2376"
#   - Windows named pipe: "npipe:////./pipe/docker_engine"
# host = "unix:///var/run/docker.sock"

# Docker connection timeout in seconds
# Used when pinging the Docker daemon to verify connectivity
timeout = 60

# =============================================================================
# Workspace Discovery
# =============================================================================
[workspace_defaults]
# Prefix for auto-created branch names when starting new sessions
# Default creates branches like: "agents/session-a1b2c3d4"
branch_prefix = "agents/"

# Additional directories to scan for git repositories
# These are added to the default paths: ~/projects, ~/code, ~/dev, etc.
workspace_scan_paths = [
    # "~/work",
    # "~/personal-projects",
]

# Patterns to exclude from repository scanning (substring match)
# These are in addition to built-in exclusions: node_modules, .git, target, dist, build
exclude_paths = [
    # "vendor",
    # "third_party",
]

# Maximum number of repositories to show in search results
max_repositories = 500

# Behavior when a target worktree path already exists
# Options: "auto_rename" | "error"
worktree_collision_behavior = "auto_rename"

# How many directory levels below each scan path the scanner descends.
# Raise it for deeply nested checkouts; every extra level multiplies the walk.
scan_max_depth = 3

# Seconds a cached repository scan stays fresh before the scanner walks the
# disk again. The cache is also invalidated when a scan path's mtime changes,
# so this is the ceiling on staleness rather than the only guard.
scan_cache_ttl_secs = 3600

# =============================================================================
# UI Preferences
# =============================================================================
[ui_preferences]
# Color theme
# Options: "dark" | "light"
theme = "dark"

# Preferred code editor command
# Used when opening files from the TUI
# Examples: "code", "cursor", "nvim", "vim"
# Falls back to: preferred_editor -> code -> $EDITOR
# preferred_editor = "code"

# Show container mode indicator in session list (Boss/Interactive icons)
show_container_status = true

# Show git changes in session list (+added, -removed, ~modified)
show_git_status = true

# Show the session menu bar (also toggled live with Shift+M)
show_session_menu_bar = true

# Which sessions the list shows by default
# Options: "all" | "active_only" | "stopped_only"
session_filter = "all"

# Sidebar geometry. Normally written by the TUI as you drag/collapse a pane
# rather than set by hand; listed here so the keys are discoverable.
# home_sidebar_width = 40
# sessions_sidebar_width = 40
# sessions_sidebar_collapsed = false
# skill_manager_sources_width = 32

# First-run wizard decisions. "unset" means "ask again next launch"; the TUI
# writes "declined" or "installed" once you answer, so hand-editing these back
# to "unset" is how you make the wizard offer them again.
# Options: "unset" | "declined" | "installed"
# statusline_decision = "unset"
# tmux_decision = "unset"

# =============================================================================
# Container Templates (Advanced)
# =============================================================================
# Define custom container templates for different development environments.
# These override or extend the built-in templates: claude-dev, node, python, rust
#
# `image_source` is a tagged enum. `type` is one of:
#   { type = "Image",        name = "node:20-slim" }
#   { type = "Dockerfile",   path = "./Dockerfile", build_args = {} }
#   { type = "ClaudeDocker", base_image = "…", build_args = {} }
# The tag values are case-sensitive.
#
# Example: Custom Node.js template with additional packages
# --8<-- parse
# [container_templates.my-node]
# name = "my-node"
# description = "Node 20 with extra tooling"
# required_env = []
# default_mcp_servers = []
#
# [container_templates.my-node.config]
# image_source = { type = "Image", name = "node:20-slim" }
# working_dir = "/workspace"
# system_packages = ["git", "curl", "vim"]
# npm_packages = []
# python_packages = []
# environment = { NODE_ENV = "development" }
# ports = [3000]
# memory_limit = 4096   # megabytes, an integer — NOT a Docker-style "4g" string
# cpu_limit = 2.0
# mount_ssh = true
# mount_git_config = true
# -->8--

# =============================================================================
# MCP Servers (Advanced)
# =============================================================================
# Configure Model Context Protocol (MCP) servers for enhanced AI capabilities.
#
# Both `installation` and `definition` are tagged enums; `type` is
# case-sensitive.
#   installation: { type = "Npm", package = "…", version = "…" }
#                 { type = "Python", package = "…", version = "…" }
#                 { type = "Git", url = "…", branch = "…", install_command = "…" }
#                 { type = "PreInstalled" }
#                 { type = "Custom", script = "…" }
#   definition:   { type = "Command", command = "…", args = [], env = {} }
#                 { type = "Json", config = { … } }
#
# Example: Context7 documentation server
# --8<-- parse
# [mcp_servers.context7]
# name = "context7"
# description = "Up-to-date library documentation"
# required_env = []
# enabled_by_default = true
# shared = true           # Pool this server across sessions (default: true).
#                         # Set false for stateful servers (browser/db bridges).
# installation = { type = "Npm", package = "@context7/mcp-server", version = "latest" }
# definition = { type = "Command", command = "npx", args = ["-y", "@context7/mcp-server"], env = {} }
# -->8--

# =============================================================================
# MCP Pool (shared MCP server processes for host/tmux sessions)
# =============================================================================
# When enabled, ainb runs `ainb mcp daemon` which spawns each shared MCP
# server ONCE and fronts it with a unix socket under
# ~/.agents-in-a-box/mcp/sockets/. New sessions get a generated .mcp.json in
# their worktree whose pooled entries point at the `ainb mcp proxy` stdio
# shim — so N concurrent sessions share 1 server process instead of N.
#
# [mcp_pool]
# enabled = true          # Master switch (default: true)
# idle_grace_secs = 300   # Reap a pooled server's child process this many
#                         # seconds after its last client detaches (default: 300)
# daemon_idle_grace_secs = 900 # Exit the whole daemon after this long with NO
#                         # clients attached anywhere (default: 900; 0 = never).
#                         # `ainb run`/import restart it on demand, so this just
#                         # stops an unused or orphaned pool lingering forever.
# monitor_refresh_secs = 2 # TUI pool overlay (sidebar MCP / `p`) auto-refresh
#                         # cadence while OPEN (default: 2; 0 = on-open + manual).
#                         # The overlay never polls when closed.

# =============================================================================
# Plugins
# =============================================================================
# Screens such as Analytics/Usage (burndown) are provided by subprocess
# plugins, discovered and loaded at startup. All discovered plugins are
# enabled by default; the keys below let you persist a per-plugin filter.
#
# Precedence (most specific wins):
#   1. AINB_DISABLE_PLUGINS=1   env — kill switch, skips all discovery
#   2. AINB_ONLY_PLUGINS=a,b    env — allowlist, overrides config
#   3. AINB_DISABLE_PLUGIN=a,b  env — denylist, overrides config below
#   4. [plugins].enabled        config allowlist (this file)
#   5. [plugins].disabled       config denylist (this file)
#   6. default                  all discovered plugins loaded
#
# `enabled` and `disabled` are mutually exclusive in intent: if `enabled`
# is set (non-empty), only those plugins load and `disabled` is ignored.
#
# [plugins]
# Load ONLY these plugins (allowlist). Leave unset to load all.
# enabled = ["burndown"]
#
# Load everything EXCEPT these (denylist). Ignored when `enabled` is set.
# disabled = ["burndown"]

# ─────────────────────────────────────────────────────────────────────────
# Skill catalog (the `[b]` browse modal / `ainb skill browse`)
# ─────────────────────────────────────────────────────────────────────────
# Settings for browsing + installing skills from a catalog. Both keys are
# optional; env vars override them.
#
# [skills]
# Which release of the ainb-curated catalog index to browse + install from.
# `latest` (default) tracks the newest published release; pin an exact tag
# (e.g. "v1.5.0") to freeze what the curated `[b]` shelf shows and installs.
# Overridden by AINB_CATALOG_RELEASE.
# catalog_release = "latest"
#
# API key for the skills.sh catalog (the non-curated `--catalog skills`
# path). Overridden by AINB_SKILLS_API_KEY. Not needed for the curated
# (`ainb`) catalog.
# api_key = "sk-..."

# ── Session-reader plugin ─────────────────────────────────────────────
# The session-reader plugin (usage analytics data backend) refreshes
# incrementally: files modified within the trailing window below are
# re-aggregated on each refresh; older history is served from a
# persisted rollup. A hard refresh (Shift+R in the Analytics screen,
# or `ainb usage --hard`) rebuilds everything from source.
#
# [session_reader]
# Trailing recent-window size in days (default 30, minimum 1).
# incremental_window_days = 30

# ── Phone bridge (`ainb fleet bridge`) ────────────────────────────────
# Two-way relay between a chat app and the fleet. Read ONLY from this
# file (`~/.agents-in-a-box/config/config.toml`, or $AINB_CONFIG_PATH) —
# the bridge does not use the layered search, so a project-level
# `.ainb/config.toml` is invisible to it.
#
# Configure at least ONE channel, or `ainb fleet bridge run` exits and
# `ainb fleet bridge install` writes the service without starting it.
#
# Every secret takes a literal, an env ref ("$TELEGRAM_BOT_TOKEN"), or a
# keychain ref ("keychain:<service>"). It is resolved in-process and is
# never written into the launchd/systemd unit.
#
# [fleet.bridge]
# Seconds to wait for a session's reply before giving up (shared default
# for every channel below; each may override it).
# response_timeout = 300
#
# Proactive push of the fleet's open asks to the phone (default true),
# and how often the attention inbox is polled (default 15s).
# outbound_enabled = true
# outbound_poll_secs = 15
#
# [fleet.bridge.telegram]
# Required: token, user_id.
# token = "$TELEGRAM_BOT_TOKEN"
# user_id = 123456789
# Optional: session to prefer when a message carries no target prefix,
# and whether group messages must @mention the bot (default true).
# default_target = "conductor"
# require_mention_in_groups = true
#
# [fleet.bridge.slack]
# Required: bot_token (xoxb-…), app_token (xapp-…), user_id.
# bot_token = "$SLACK_BOT_TOKEN"
# app_token = "$SLACK_APP_TOKEN"
# user_id = "U0123ABC"
# Optional: "mentions" (default) acts only on @mentions and DMs; "all"
# acts on every message in channels the bot is in.
# listen_mode = "mentions"
# default_target = "conductor"
#
# [fleet.bridge.discord]
# Required: token, user_id (snowflake, as a string).
# token = "$DISCORD_BOT_TOKEN"
# user_id = "123456789012345678"
# Optional: channel to reply in when the inbound message carries none.
# channel_id = "123456789012345678"
# default_target = "conductor"

# =============================================================================
# Usage analytics (the Analytics/burndown screen)
# =============================================================================
# Written by the burndown plugin (`ainb burndown plan set …`) as well as read
# by it — hand-edit if you prefer, but note both this file and that command
# target the same path.
#
# --8<-- parse
# [usage.plan]
# id = "claude-max"        # "claude-pro" | "claude-max" | "claude-max5x"
#                          # | "cursor-pro" | "custom" | "none"
# monthly_usd = 200.0
# provider = "claude"      # "all" | "claude" | "codex" | "cursor"
# reset_day = 1            # day of month the allowance resets
# set_at = "2026-01-01T00:00:00Z"
#
# [usage.currency]
# code = "GBP"
# symbol = "£"
# usd_rate = 0.79          # multiply USD figures by this for display
#
# # Map a model id reported by an agent onto one ainb knows the rate for.
# [usage.model_aliases]
# cursor-auto = "claude-sonnet-4-5"
# -->8--

# =============================================================================
# Fleet
# =============================================================================
# --8<-- parse
# [fleet]
# # Terminal the macOS Fleet app opens when you jump to a session.
# # Options: "warp" | "iterm" | "ghostty" | "terminal" (default: "warp")
# terminal = "warp"
#
# ## Minutes of quiet before a session reads IDLE. One knob for both producers
# ## (the tmux classifier and notifyd's hook fold), so they cannot disagree.
# ## Env: AINB_FLEET_IDLE_MIN
# idle_min = 5
#
# ## How `ainb fleet send` delivers.
# ## "tmux" send-keys first with a broker fallback (default), "tmux-only" never
# ## touches the broker, "broker" tries the broker first.
# ## Env: AINB_FLEET_TRANSPORT
# transport = "tmux"
#
# ## Attach cost/hint enrichment to fleet rows. False still serves free cached
# ## suggestions but runs no producer, so it spends no tokens.
# ## Env: AINB_FLEET_ENRICH
# enrich = true
#
# ## Milliseconds before a STICKY hook row (ASK/ERR/WAIT/IDLE) stops being
# ## trusted and the reader falls back to a live scan. 0 disables the check:
# ## those states only change on a new event, so age is a poor signal for them.
# ## Env: AINB_FLEET_STATE_STALE_MS
# state_stale_ms = 0
#
# ## Milliseconds before a HEALTHY hook row (RUNNING/DONE) stops suppressing
# ## the live scan. Its own knob, because a daemon that stopped materializing
# ## would otherwise mask a real need forever. Before this key existed both
# ## windows read AINB_FLEET_STATE_STALE_MS with different hardcoded fallbacks.
# ## Env: AINB_FLEET_HEALTHY_STATE_STALE_MS (AINB_FLEET_STATE_STALE_MS still
# ## works as a legacy fallback).
# healthy_state_stale_ms = 300000
#
# ## Seconds of pane silence before tmux discovery calls a live session
# ## "between turns" rather than working.
# ## Env: AINB_FLEET_TMUX_IDLE_AFTER_SECS
# tmux_idle_after_secs = 120
#
# # Budget caps for `ainb fleet cost`, in USD. Unset means no cap.
# [fleet.cost]
# session_usd = 5.0
# group_usd = 25.0
#
# # Per-session and per-group overrides of the caps above.
# [fleet.cost.session_overrides]
# "my-long-running-session" = 20.0
#
# [fleet.cost.group_overrides]
# "release-swarm" = 100.0
#
# # Which surface answers Claude interviews.
# # Options: "native" | "fleet" (default: "native")
# [fleet.interview]
# surface = "native"
# -->8--

# =============================================================================
# Presets
# =============================================================================
# Where the single presets.toml lives. Relative paths resolve against this
# file's directory, so the default lands on ~/.agents-in-a-box/presets.toml.
# `~` is NOT expanded — use an absolute path or a relative one.
#
# --8<-- parse
# [presets]
# file = "../presets.toml"
# -->8--

# =============================================================================
# UI tunables
# =============================================================================
# Cadences and query bounds, as opposed to [ui_preferences] above, which is
# what the interface looks like and which the TUI writes back itself.
#
# --8<-- parse
# [ui]
# ## Milliseconds between input polls. Lower feels snappier and costs CPU;
# ## ~30fps by default.
# tick_rate_ms = 33
#
# ## Milliseconds between the heavy periodic passes (tmux previews, mascot
# ## animation, OAuth refresh checks). Deliberately much coarser than the poll:
# ## running these per poll starves the event loop.
# app_tick_ms = 250
#
# ## Rows the attention-marker query reads per refresh, and how far back an
# ## event may still raise a session's [?] / [!] marker.
# session_query_limit = 500
# session_lookback_hours = 6
#
# ## Rows the Inbox lists. The query runs every render, so keep it modest.
# inbox_list_limit = 200
#
# ## Milliseconds in which two clicks count as one double-click.
# double_click_ms = 300
# -->8--

# =============================================================================
# Usage client
# =============================================================================
# How ainb FETCHES and caches usage data. Deliberately not [usage] above: that
# section belongs to the burndown plugin, which writes it itself, so ainb-core
# treats it as read-only. These four knobs are core's own.
#
# --8<-- parse
# [usage_client]
# ## Port the ainb-managed Headroom compression proxy listens on.
# ## Env: AINB_HEADROOM_PORT
# headroom_port = 8787
#
# ## Seconds `ainb usage` waits for data before giving up. The first scan of a
# ## large ~/.claude/projects is slow; raise this against a huge archive.
# ## Env: AINB_USAGE_TIMEOUT_SECS
# fetch_timeout_secs = 120
#
# ## Seconds between Codex statusline usage refreshes.
# ## Env: AINB_CODEX_USAGE_TTL_SECS
# codex_ttl_secs = 60
#
# ## Override the usage cache database. Unset derives
# ## <home>/.agents-in-a-box/cache/usage.db.
# ## Env: AINB_USAGE_CACHE_DB
# cache_db = "/tmp/usage.db"
# -->8--

# =============================================================================
# Daemons
# =============================================================================
# --8<-- parse
# [daemons]
# ## Milliseconds without a heartbeat before a daemon whose pid is STILL alive
# ## (a wedged daemon that stopped ticking) reads stale. A dead pid is caught
# ## immediately regardless of this window.
# stale_after_ms = 90000
#
# ## Milliseconds the bridge may go without a SUCCESSFUL attention poll before
# ## its proactive-push half counts as broken. A different clock from the one
# ## above: that asks "is the process alive", this asks "can it do the job".
# attention_stale_after_ms = 45000
#
# [notifyd]
# ## Seconds one (session, event) pair waits before it may raise another OS
# ## notification. Keeps a noisy session out of Notification Center.
# os_debounce_secs = 60
#
# ## Seconds an unanswered permission request waits before it is auto-DENIED.
# ## The bottom of a timeout ladder (broker < client re-dial < Claude's hook
# ## timeout), so values above 630 are clamped rather than trusted.
# approval_timeout_secs = 600
# -->8--

# =============================================================================
# Web dashboard
# =============================================================================
# Defaults for `ainb web`. Its CLI flags still win, because a flag is a
# decision about one invocation and this file is a standing preference.
#
# The bearer token is NOT settable here. Pass `--token <secret>`; it goes to
# the OS keychain and never into this file.
#
# --8<-- parse
# [web]
# ## host:port to bind. A non-loopback address still has to clear the bind
# ## security check, so setting it here cannot expose anything a flag could not.
# listen = "127.0.0.1:8420"
#
# ## Serve viewer-only: the live WS terminal and POST /api/answer are refused.
# read_only = false
#
# ## Allow a non-loopback bind with no token. Honoured ONLY together with
# ## read_only; the security check refuses it otherwise.
# insecure_bind = false
# -->8--

# =============================================================================
# ACP adapters
# =============================================================================
# The adapter registry the Hangar daemon spawns ACP sessions from. Naming an
# adapter overrides the built-in entry; naming a new one adds it. Omitting the
# section keeps the built-in `claude-agent-acp` and `codex-acp` entries.
#
# --8<-- parse
# [acp.adapters.claude-agent-acp]
# ## Executable to spawn. Unset resolves the adapter's own name on PATH.
# command = "/opt/homebrew/bin/claude-agent-acp"
#
# ## The permission mode PINNED at session/new and re-asserted after every
# ## session/load. Never leave an adapter to inherit ambient state: one was
# ## observed picking up "bypassPermissions", which disables the whole
# ## permission surface silently.
# ## Options: "default" | "acceptEdits" | "bypassPermissions" | "plan"
# permission_mode = "default"
# -->8--

# =============================================================================
# Hangar daemon
# =============================================================================
# NOT part of this file. These knobs live in the Hangar daemon's `daemon_config`
# SQLite table (~/.agents-in-a-box/hangar.db), because the daemon reads them on
# its own tick without restarting. They are listed in the settings screen under
# "Hangar Daemon" and are settable from either surface:
#
#   ainb config set hangar_daemon.autostandup.enabled true
#   ainb hangar daemon config set autostandup.stagnant_min 30
#
# Writing `[hangar_daemon]` into this file does nothing at all.
#
#   hangar_daemon.autostandup.enabled          bool         (default false)
#   hangar_daemon.autostandup.stagnant_min     int 1..1440  (default 15)
#   hangar_daemon.autostandup.cooldown_min     int 1..1440  (default 60)
#   hangar_daemon.autostandup.max_concurrent   int 1..64    (default 1)
#   hangar_daemon.card_agent.default           claude|codex|copilot (default claude)
#   hangar_daemon.workspace.creation_disabled  bool         (default false)
