# agents-in-a-box — workspace root for Python projects in this monorepo.
# Workspace members:
#   - reflect-kb            local file-based learning KB + `reflect` CLI
#   - ainb-reflect-memory   Postgres-backed GraphRAG memory substrate
#                           (extractable as a standalone repo later)
# Additional packages can be added by extending workspace.members.

[tool.uv.workspace]
members = ["reflect-kb", "ainb-reflect-memory"]
