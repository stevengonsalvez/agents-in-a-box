<rect width="1200" height="760" fill="#0a1628"/>
<text x="40" y="44" class="title">Hangar — Layered System Architecture</text>
<rect x="480" y="72" width="240" height="46" rx="6" fill="#0f2942" stroke="#fbbf24" stroke-width="1.5"/>
<text x="600.0" y="96" text-anchor="middle" class="lbl">User (terminal)</text>
