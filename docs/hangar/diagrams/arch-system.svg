<text x="600.0" y="194" text-anchor="middle" class="sub">crate folder crates/ainb-core  ·  pkg = ainb</text>
<text x="600.0" y="209" text-anchor="middle" class="sub"></text>
<rect x="390" y="200" width="420" height="56" rx="6" fill="#0f2942" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="600.0" y="224" text-anchor="middle" class="lbl">plugin-runtime v2</text>
<text x="600.0" y="244" text-anchor="middle" class="sub">spawns plugin subprocess · stdio JSON-RPC</text>
<text x="600.0" y="259" text-anchor="middle" class="sub">Content-Length framing</text>
<rect x="360" y="300" width="480" height="70" rx="6" fill="#13243f" stroke="#38bdf8" stroke-width="1.5"/>
<text x="600.0" y="324" text-anchor="middle" class="lbl">Plugin: hangar-tui  (ainb-plugin-hangar)</text>
<text x="600.0" y="344" text-anchor="middle" class="sub">renders 9 screens · dials the daemon</text>
<rect x="330" y="440" width="540" height="84" rx="6" fill="#13243f" stroke="#fb923c" stroke-width="1.5"/>
<text x="600.0" y="464" text-anchor="middle" class="lbl">ainb-hangar-daemon  (separate binary)</text>
<text x="600.0" y="484" text-anchor="middle" class="sub">claim loop · autopilot scheduler · RPC server</text>
<text x="600.0" y="499" text-anchor="middle" class="sub">beads sync · observability</text>
<rect x="360" y="556" width="480" height="60" rx="6" fill="#0f2942" stroke="#2dd4bf" stroke-width="1.5"/>
<text x="600.0" y="580" text-anchor="middle" class="lbl">ainb-hangar-store</text>
