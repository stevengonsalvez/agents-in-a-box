<text x="170.0" y="324" text-anchor="middle" class="lbl">ainb-hangar-core</text>
<text x="170.0" y="344" text-anchor="middle" class="sub">IO-free domain types</text>
<text x="170.0" y="359" text-anchor="middle" class="sub">ids · clock · task_status · cron</text>
<text x="170.0" y="374" text-anchor="middle" class="sub">env_policy · skill · autopilot traits</text>
<text x="170.0" y="389" text-anchor="middle" class="sub">pr_url · token · result</text>
<rect x="40" y="440" width="260" height="84" rx="6" fill="#0f2942" stroke="#fbbf24" stroke-width="1.5"/>
