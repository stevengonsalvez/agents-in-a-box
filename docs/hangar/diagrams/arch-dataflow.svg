<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-monospace, monospace">
<defs>
<style>.title{font-size:18px;fill:#e2e8f0;font-weight:bold}.lbl{font-size:13px;fill:#e2e8f0}.sub{font-size:11px;fill:#94a3b8}.albl{font-size:11px;fill:#e2e8f0}.flow{font-size:13px;fill:#94a3b8;font-weight:bold}</style>
<marker id="aBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#38bdf8"/></marker>
