name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: ainb-tui

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Format check
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Tests — cross-platform with nextest
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - uses: taiki-e/install-action@nextest
      - run: "cargo nextest run --lib --all-features --no-fail-fast -- --skip docker:: --skip cli::run::tests::test_validate_provider_installed_claude --skip models::usage::tests::custom_ranges_are_inclusive"
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Unused dependency detection
  # ────────────────────────────────────────────────────────────────────────────
  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main
        with:
          manifest-path: ainb-tui/Cargo.toml
