name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "plugins/ainb-hooks/**"
      - "ainb-tui/crates/ainb-plugin-hangar/**"
      - "scripts/hangar/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
  # The chat-bus smoke lane is opt-in and boots real processes; manual dispatch
  # is how an operator asks for it without labelling a PR.
  workflow_dispatch:

# Superseded pushes used to run to completion: four pushes to one branch in
# half an hour queued four full runs, and the last one spent 190 minutes
# waiting for a runner rather than working. Group per ref and cancel only on
# pull_request, a push to main must still get its own complete run.
#
# The gates below say `!cancelled()`, never `always()`. `always()` runs a job
# or step even when the run has been CANCELLED, so with `always()` in place
# this concurrency group would cancel a superseded run and then watch it keep
# building anyway. `!cancelled()` keeps the same fail-open behaviour when the
# `changes` job errors, which is the only reason the gates reach for a status
# function at all.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: ainb-tui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Which paths changed?
  #
  # Path filtering lives HERE, on the jobs, and NOT on `on.pull_request.paths`.
  # A workflow skipped by `on.paths` creates no check runs at all, so a required
  # context stays "Expected" forever and the PR can never merge — that is what
  # blocked every Swift-only and docs-only PR (bead mbl).
  # A job skipped by an `if:` DOES report, and a skipped job satisfies a required
  # check, so the gate stays honest while irrelevant PRs still cost no compute.
  #
  # `on.push` keeps its own `paths:` — push runs are not required checks, so
  # main-branch CI cost is unchanged.
  #
  # WHAT HAPPENS WHEN THIS JOB ITSELF FAILS. The four matrix jobs below
  # (`test`, `ainb-hooks`, `fleet-send-tmux`, `hangar-e2e`) gate their STEPS
  # on `needs.changes.outputs.relevant != 'false'`. If a failed `changes`
  # made that comparison false, all four would conclude GREEN having
  # executed nothing: the required checks would be satisfied by four jobs
  # that ran no tests, and a PR could merge untested. That is NOT what
  # happens, and it is measured rather than assumed:
  #
  # Run 33393560903 forced this job to fail before dorny/paths-filter could
  # set `relevant` (the filter step reports `skipped`, so the output is
  # genuinely absent, not stale). All sixteen jobs dispatched, the four
  # matrix jobs reported under their EXPANDED names, and the step-level
  # guards RAN: `ainb-hooks (ubuntu-latest)` (job 99492659192) concluded
  # success with all seven of its real steps executed, and both
  # `fleet send integrity` legs did the same. A missing output resolves to
  # the empty string, and `'' != 'false'` is true.
  #
  # Worth re-measuring if GitHub ever changes that resolution, because the
  # failure would be SILENT: a job green-with-every-step-skipped is
  # indistinguishable from a real pass in `gh pr checks` or in any job-level
  # summary. Only the `steps[]` conclusions from
  # `/actions/runs/<id>/jobs` tell the two apart.
  # ────────────────────────────────────────────────────────────────────────────
  changes:
    name: Detect relevant changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
      acp: ${{ steps.filter.outputs.acp }}
    steps:
      - uses: dorny/paths-filter@v3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            relevant:
              - 'ainb-tui/**'
              - 'plugins/ainb-hooks/**'
              - 'scripts/hangar/**'
              - 'Cargo.*'
              - '.github/workflows/ci.yml'
              # The generated docs live outside ainb-tui/. Without them here, a
              # PR that hand-edits a generated page skips the very job that
              # would have caught the edit.
              - 'docs/man/**'
              - 'docs/tui/cli.md'
            # Coupled lane. A store change (a migration especially) can break
            # the ACP writer without touching one line of ainb-acp, so the
            # store fires this lane too; so does the daemon, which hosts the
            # library from Phase 5 on.
            acp:
              - 'ainb-tui/crates/ainb-acp/**'
              - 'ainb-tui/crates/ainb-hangar-store/**'
              - 'ainb-tui/crates/ainb-hangar-daemon/**'
              - 'ainb-tui/Cargo.toml'
              - 'ainb-tui/Cargo.lock'
              - '.github/workflows/ci.yml'

  # ────────────────────────────────────────────────────────────────────────────
  # Format check
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant != 'false')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: ${{ env.WORKING_DIR }}
      # An abandoned debugging probe reverts real behaviour while every doc
      # comment, test and help string around it still asserts the fix. Cheap
      # grep, runs in the fastest job.
      - name: No leftover debugging probes
        run: bash scripts/check-no-probes.sh
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Generated-docs freshness. docs/tui/cli.md AND docs/man/ainb.1 are both
  # generated from `ainb --help`. Fails if either drifts, so the binary stays
  # the single source of truth. One job: the build is paid for once.
  #
  # DO NOT RENAME `name:`. It is a required status check in the `main` ruleset,
  # matched by the literal string below. A renamed job reports under the new
  # name, the required context stays "Expected" forever, and every PR is
  # unmergeable until the ruleset is edited to match. Widening what this job
  # covers is free; renaming it is not.
  # ────────────────────────────────────────────────────────────────────────────
  cli-docs:
    name: CLI reference freshness
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant != 'false')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Build ainb
        run: cargo build -p ainb
        working-directory: ${{ env.WORKING_DIR }}
      - name: Regenerate CLI reference from the binary
        run: AINB_BIN=target/debug/ainb bash scripts/gen-cli-reference.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: Assert docs/tui/cli.md is up to date
        run: |
          # Tracked-ness FIRST: `git diff` ignores untracked files, so an
          # uncommitted generated page would make the diff a silent no-op and
          # this job would go green having shipped nothing.
          if ! git ls-files --error-unmatch docs/tui/cli.md > /dev/null 2>&1; then
            echo "::error::docs/tui/cli.md is not tracked by git: generate it and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- docs/tui/cli.md; then
            echo "::error::docs/tui/cli.md is stale: run ainb-tui/scripts/gen-cli-reference.sh and commit the result." >&2
            exit 1
          fi
      - name: Regenerate the man page from the binary
        run: AINB_BIN=target/debug/ainb bash scripts/gen-man.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: Assert docs/man/ainb.1 is up to date
        run: |
          # Same tracked-ness assertion as above: without it a man page that
          # was never committed passes the freshness gate, and the release
          # tarball / install.sh ship no man page at all.
          if ! git ls-files --error-unmatch docs/man/ainb.1 > /dev/null 2>&1; then
            echo "::error::docs/man/ainb.1 is not tracked by git: generate it with ainb-tui/scripts/gen-man.sh and commit the result." >&2
            exit 1
          fi
          if ! git diff --exit-code -- docs/man/ainb.1; then
            echo "::error::docs/man/ainb.1 is stale: run ainb-tui/scripts/gen-man.sh and commit the result." >&2
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Tests — cross-platform with nextest
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    needs: changes
    # Bare `!cancelled()`, with NO relevance clause: it exists so this job is
    # never SKIPPED. `needs: changes` carries an implicit `success()`, so one
    # failure in `changes` would skip this job, and GitHub does not expand
    # `strategy.matrix` for a job it never dispatches: it reports a single
    # check under the literal unexpanded name. Ruleset 11610771 requires the
    # EXPANDED names, so that one skip strands every open PR on "Expected".
    # The relevance clause stays on the steps, where a gated-out PR still
    # costs no compute and the check still reports under its real name.
    # MEASURED (run 33393560903): when `changes` FAILS, `relevant` is left
    # unset, an unset output resolves to '', and `'' != 'false'` is TRUE, so
    # those step guards RUN rather than skip. See the `changes` job above.
    if: '!cancelled()'
    # 40 against a 28.7min p95. A macOS leg once sat here for 97 minutes with
    # the nextest step never recording a completion, and with no budget set
    # nothing would have killed it before GitHub's 360min default.
    timeout-minutes: 40
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      # Linux only: these paths and `df --output` are GNU/Linux, and the macOS
      # leg of this matrix has never hit the wall.
      #
      # MEASURED, 2026-08-24, run 32785104108: this job's target tree peaks at
      # 85G and the runner offers 86G free after the image. A ~1G margin, which
      # is why it failed roughly one run in three rather than every time, and
      # why it always died on `ainb-plugin-abtop`: that is the LAST of the six
      # nested plugin builds `real_plugin_axes` runs, so it links at peak
      # accumulation. At the failure the filesystem was 145G/145G, 8.8M free.
      #
      # It does NOT present as a disk error. `rust-lld` sizes the output with
      # ftruncate, mmaps it, and only faults when a page is written to a
      # filesystem that can no longer allocate blocks, so ENOSPC arrives as
      # `ld terminated with signal 7 [Bus error]` under an LLVM crash report.
      # That cost two days of it being read as a flake, then as infra.
      #
      # The Contracts job hit the same wall and took the same treatment; this
      # reclaim frees 20G (59G used here against 39G there, same image), taking
      # the margin from ~1G to ~21G.
      - name: Reclaim runner disk
        if: >-
          runner.os == 'Linux' && !cancelled() &&
          (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost
          df -h /
      # Fail FAST and legibly if the headroom ever goes away again, rather than
      # 20 minutes later as a linker crash nobody can attribute.
      - name: Assert disk headroom for the --all-features build
        if: >-
          runner.os == 'Linux' && !cancelled() &&
          (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          avail=$(df --output=avail / | tail -1)
          need=94371840   # 90G in 1K blocks; the tree measured 85G
          if [ "$avail" -lt "$need" ]; then
            echo "::error::only $((avail/1048576))G free, this job's build needs ~85G. Reclaim more before it links, because rust-lld reports exhaustion as SIGBUS, not as a disk error."
            exit 1
          fi
          echo "$((avail/1048576))G free, need ~85G"
      - uses: dtolnay/rust-toolchain@stable
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: Swatinem/rust-cache@v2
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          workspaces: "ainb-tui -> target"
          # Same wall the Contracts job hit, and the same treatment. This job
          # also builds `--all-features` across the workspace, and archiving
          # that target tree exhausts GitHub-hosted runner disk during
          # rust-cache's post-job pass: observed three consecutive runs where
          # `cargo nextest` SUCCEEDED and the job was then failed by
          # `Post Run Swatinem/rust-cache@v2` with "No space left on device".
          # A green test run must not be reported as a failure by the step that
          # saves a cache for next time.
          cache-targets: false
          # Registry restore is still useful; only saving invokes the failing pass.
          save-if: false
      - uses: taiki-e/install-action@nextest
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      # `--lib` alone builds ONLY in-source `#[cfg(test)]` modules, so every
      # integration target under `crates/*/tests/` was invisible here: whole test
      # files could be added — or stop compiling — without any job noticing.
      # `--tests` includes them.
      #
      # The `tripwire_*` binaries are excluded: they drive a real `ainb tui`
      # under tmux against staged plugins, which this job deliberately does not
      # provision (the hangar ones are the `hangar-e2e` job's authoritative
      # matrix; the `ainb` ones are launched by `ainb-hooks` / their own steps).
      # Running them here fails on the missing harness, not on the code. Every
      # other integration target now runs.
      #
      # The former trailing `-- --skip …` args are dropped because the two tests
      # they muted are FIXED, not because the flag was inert — nextest does
      # honour it. Both were host-dependent rather than broken:
      # `test_validate_provider_installed_claude` asserted a real `claude` was
      # installed on the machine, and `custom_ranges_are_inclusive` hardcoded a
      # `+01:00` wall clock for a range anchored at LOCAL midnight. They now
      # drive a stub on a controlled `$PATH` and derive their boundaries from
      # the host's own zone, so nothing needs muting.
      #
      # `--workspace` is load-bearing. Without it nextest honours the
      # `default-members` in ainb-tui/Cargo.toml (ainb-core and
      # ainb-hangar-daemon), so this job tested 2 of 29 crates and silently
      # skipped 27, roughly 160 test files. Everything in ainb-hangar-store
      # (the database layer, 74 files) and ainb-plugin-hangar (46) had never
      # run here. `--lib --tests` widened WHICH targets are built; this
      # widens WHICH crates they are built from.
      - run: "cargo nextest run --workspace --lib --tests --all-features --no-fail-fast -E 'not binary(/^tripwire_/)'"
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Contracts: deterministic golden/mutation gates, own job, no rerun-to-green
  #
  # Runs the five contract test binaries from the contract-testing-hardening
  # plan (issue #500, phases 1-4): argv_golden_matrix (frozen per-provider CLI
  # invocation shape), migration_upgrade_full_chain (forward-chain replay over
  # a populated, adversarially-seeded db), and the ainb-plugin-cts-v2 package
  # (axes, real_plugin_axes, wire_surface_gate: 14-axis protocol conformance
  # against real in-tree plugin binaries plus the wire-surface semver gate).
  #
  # Why a separate job instead of trusting `Test` to carry them: in the
  # general `cargo test` pool a contract failure is one line among thousands
  # and reads as noise. That is exactly how a real `BdLock` two-holder race
  # got mistaken for a flake for days this week. These tests compare
  # deterministic renderings to committed golden/lock files, so they cannot
  # legitimately flake. POLICY: a red job here is NEVER rerun to green. Fix
  # the code or delete the contract; do not re-run the workflow. See
  # ainb-tui/CLAUDE.md for the regeneration commands when a change is
  # intentional.
  #
  # DELIBERATE: `migration_upgrade_full_chain` and the `ainb-plugin-cts-v2`
  # binaries need `--workspace`, since this repo's `default-members` (see
  # ainb-tui/Cargo.toml) covers only ainb-core and ainb-hangar-daemon and
  # both live outside it. `Test` now passes `--workspace` too, so all three
  # of these binaries double-run: once here, once there.
  #
  # DELIBERATE: that overlap is kept, and no exclusion is added to `Test`'s
  # `-E` filter to remove it. This job exists for the SIGNAL: a contract
  # failure gets its own red check and its own no-rerun policy instead of
  # being one line among thousands. Running the same binary twice costs
  # seconds; a filter typo silently dropping coverage is the exact failure
  # class this effort exists to prevent.
  # ────────────────────────────────────────────────────────────────────────────
  contracts:
    name: Contracts
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant != 'false')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Same disk pressure the `cache-targets: false` below already answers, one
      # step earlier: it is now the BUILD that runs out, not the post-job archive.
      # `--all-features` across the workspace, plus the nested `cargo build` that
      # `real_plugin_axes` runs per in-tree plugin, outgrew what a stock runner
      # leaves free — surfacing as `failed to build archive …: No space left on
      # device` while linking ainb-plugin-hangar, which the harness could only
      # report as `exit status: 101`. It read as a broken contract, and this job's
      # policy is never to rerun one to green, so it had to be told apart from a
      # real one: the same run passed at 10:30 and failed at 10:33 on comparable
      # trees, which is borderline-disk behaviour rather than a frozen guarantee
      # breaking. The preinstalled Android / .NET / GHC toolchains are tens of GB
      # and nothing in this job uses them.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
          # Contract suite builds every feature. Archiving its target tree exhausts
          # GitHub-hosted runner disk during rust-cache's post-job metadata pass.
          cache-targets: false
          # Registry restore is useful; saving invokes the failing post-job pass.
          save-if: false
      - uses: taiki-e/install-action@nextest
      - run: >
          cargo nextest run --workspace --all-features --no-fail-fast
          -E 'binary(argv_golden_matrix) + binary(migration_upgrade_full_chain) + package(ainb-plugin-cts-v2)'
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # ainb-hooks daemon + plugin integration tests
  # ────────────────────────────────────────────────────────────────────────────
  ainb-hooks:
    name: ainb-hooks (${{ matrix.os }})
    needs: changes
    # Bare `!cancelled()`, with NO relevance clause: it exists so this job is
    # never SKIPPED. `needs: changes` carries an implicit `success()`, so one
    # failure in `changes` would skip this job, and GitHub does not expand
    # `strategy.matrix` for a job it never dispatches: it reports a single
    # check under the literal unexpanded name. Ruleset 11610771 requires the
    # EXPANDED names, so that one skip strands every open PR on "Expected".
    # The relevance clause stays on the steps, where a gated-out PR still
    # costs no compute and the check still reports under its real name.
    # MEASURED (run 33393560903): when `changes` FAILS, `relevant` is left
    # unset, an unset output resolves to '', and `'' != 'false'` is TRUE, so
    # those step guards RUN rather than skip. See the `changes` job above.
    if: '!cancelled()'
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: dtolnay/rust-toolchain@stable
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: Swatinem/rust-cache@v2
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          workspaces: "ainb-tui -> target"
      # lsof backs the notifyd ownership proof: a pid is only signalled once it is
      # shown to hold this home's socket. The proof fails closed, so without lsof
      # nothing is ever proven and reaping silently becomes a no-op, which fails
      # `reap_signals_a_notifyd_serving_this_home` on Linux while macOS passes.
      - name: Install tmux and lsof (Linux only; macOS runner ships them)
        if: >-
          matrix.os == 'ubuntu-latest' && !cancelled() &&
          (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: sudo apt-get update && sudo apt-get install -y tmux jq lsof
      - name: Verify hook script parses on the runner
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: bash -n plugins/ainb-hooks/hooks/notify.sh
      - name: Stall guard compiles + self-check passes
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          python3 -m py_compile plugins/ainb-hooks/hooks/stall_guard.py
          python3 plugins/ainb-hooks/hooks/stall_guard.py --self-test
      - name: Build + lib tests (ainb-plugin-notifyd)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo test -p ainb-plugin-notifyd --lib --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: End-to-end hook → socket → SQLite
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo test -p ainb-plugin-notifyd --test end_to_end --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Tripwire — Inbox screen open + render
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo test -p ainb --test tripwire_inbox_opens_and_renders --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Tripwire — Fleet panel renders an ACP session
        # The TUI is the operating surface. The chat bus shipped a daemon and a
        # CLI, and the panel maps the ACP wire token in ONE place, falling back
        # to `unknown` in silence. Without this, that line has no coverage on
        # the screen an operator actually looks at.
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo test -p ainb --test tripwire_fleet_panel_shows_acp_session --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Sandbox script safety guards (rm -rf belts)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo test -p ainb --test sandbox_script_safety_guards --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Fleet send-path integrity against a REAL tmux pane
  #
  # `Test` already COMPILES and selects this binary: `--all-features` turns on
  # ainb-fleet-core's `tmux-tests` feature and `tmux_send_integrity` is not
  # matched by that job's `not binary(/^tripwire_/)` filter. But neither runner
  # image ships tmux, so there every test self-skips and the send-path proof is
  # vacuously green. This job is the lane where it actually executes.
  #
  # The trailing grep is the point: an environment that silently degrades to
  # SKIP is exactly the trap `run_all_tripwires.sh` documents for its macOS
  # leg, and a skipped suite here would mean the chunked-write / capture-failure
  # guarantees ship untested while CI stays green.
  #
  # Safe to run on a shared machine as well as a runner: the tests clear `TMUX`
  # and pin `TMUX_TMPDIR` onto a pid-unique socket dir, so their panes live on a
  # private tmux server and never join the ambient one.
  # ────────────────────────────────────────────────────────────────────────────
  fleet-send-tmux:
    name: fleet send integrity (${{ matrix.os }})
    needs: changes
    # Bare `!cancelled()`, with NO relevance clause: it exists so this job is
    # never SKIPPED. `needs: changes` carries an implicit `success()`, so one
    # failure in `changes` would skip this job, and GitHub does not expand
    # `strategy.matrix` for a job it never dispatches: it reports a single
    # check under the literal unexpanded name. Ruleset 11610771 requires the
    # EXPANDED names, so that one skip strands every open PR on "Expected".
    # The relevance clause stays on the steps, where a gated-out PR still
    # costs no compute and the check still reports under its real name.
    # MEASURED (run 33393560903): when `changes` FAILS, `relevant` is left
    # unset, an unset output resolves to '', and `'' != 'false'` is TRUE, so
    # those step guards RUN rather than skip. See the `changes` job above.
    if: '!cancelled()'
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: dtolnay/rust-toolchain@stable
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: Swatinem/rust-cache@v2
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          workspaces: "ainb-tui -> target"
      # macOS runner images do NOT ship tmux (actions/runner-images macos-15
      # README), the same reason `hangar-e2e` brew-installs it.
      - name: Install tmux (apt-get on Linux, brew on macOS)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Send-path integrity against a real tmux pane
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          set -o pipefail
          cargo test -p ainb-fleet-core --features tmux-tests \
            --test tmux_send_integrity --no-fail-fast -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/tmux-send-integrity.log"
          if grep -q '^SKIP:' "$RUNNER_TEMP/tmux-send-integrity.log"; then
            echo "::error::tmux send-integrity suite SKIPped, so the send path was never exercised on this runner"
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Codex launch-pane behaviour against a REAL tmux server
  #
  # Same trap as `fleet-send-tmux` above, same remedy. `Test` compiles and
  # selects these tests, but neither runner image ships tmux, so `require_tmux!`
  # self-skips and they pass vacuously. That is not hypothetical here: three
  # separate defects shipped in this area behind 24-of-24 green CI, including
  # one that would have failed every Codex launch outright, because nothing in
  # CI ever started a tmux session.
  #
  # The trailing grep is the point: a suite that degrades to SKIP must fail the
  # job, or the guard is theatre.
  # ────────────────────────────────────────────────────────────────────────────
  codex-launch-tmux:
    name: codex launch pane (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        if: >-
          always() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: dtolnay/rust-toolchain@stable
        if: >-
          always() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: Swatinem/rust-cache@v2
        if: >-
          always() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          workspaces: "ainb-tui -> target"
      # macOS runner images do NOT ship tmux, same as fleet-send-tmux above.
      - name: Install tmux (apt-get on Linux, brew on macOS)
        if: >-
          always() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Launch-pane behaviour against a real tmux pane
        if: >-
          always() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          set -o pipefail
          cargo test -p ainb --test behavioral keeping_dead_pane \
            --no-fail-fast -- --nocapture \
            2>&1 | tee "$RUNNER_TEMP/codex-launch-tmux.log"
          cargo test -p ainb --lib capture_failed_launch_pane_reads_a_dead_pane \
            --no-fail-fast -- --nocapture \
            2>&1 | tee -a "$RUNNER_TEMP/codex-launch-tmux.log"
          if grep -q '^SKIP:' "$RUNNER_TEMP/codex-launch-tmux.log"; then
            echo "::error::codex launch-pane suite SKIPped, so the launch path was never exercised on this runner"
            exit 1
          fi
          if ! grep -q 'test result: ok. 2 passed' "$RUNNER_TEMP/codex-launch-tmux.log"; then
            echo "::error::expected both keeping_dead_pane tests to run; filter may have stopped matching"
            exit 1
          fi
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Hangar control-plane end-to-end tripwires (P0-P9)
  #
  # Mirrors the `ainb-hooks` per-feature pattern: install tmux on Linux, build
  # the daemon binary + stage the bundled plugins, then run every hangar
  # `tripwire_*` via scripts/hangar/run_all_tripwires.sh on BOTH target OSes.
  # No `cargo clippy -D warnings` gate here — the workspace carries pre-existing
  # clippy debt and CI gates on `cargo fmt --check` only (see `fmt` job).
  # ────────────────────────────────────────────────────────────────────────────
  hangar-e2e:
    name: hangar-e2e (${{ matrix.os }})
    needs: changes
    # Bare `!cancelled()`, with NO relevance clause: it exists so this job is
    # never SKIPPED. `needs: changes` carries an implicit `success()`, so one
    # failure in `changes` would skip this job, and GitHub does not expand
    # `strategy.matrix` for a job it never dispatches: it reports a single
    # check under the literal unexpanded name. Ruleset 11610771 requires the
    # EXPANDED names, so that one skip strands every open PR on "Expected".
    # The relevance clause stays on the steps, where a gated-out PR still
    # costs no compute and the check still reports under its real name.
    # MEASURED (run 33393560903): when `changes` FAILS, `relevant` is left
    # unset, an unset output resolves to '', and `'' != 'false'` is TRUE, so
    # those step guards RUN rather than skip. See the `changes` job above.
    if: '!cancelled()'
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      - uses: dtolnay/rust-toolchain@stable
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          # This action installs with rustup's MINIMAL profile, which omits
          # clippy. The span-guard gate below needs it, and a missing component
          # would red the job with `no such command: clippy`.
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        with:
          workspaces: "ainb-tui -> target"
      # Both hangar suites below drive nextest (one run per package instead of
      # one `cargo test` per test file). Unlike the `test` job this one has no
      # other nextest step, so without this install they fail with
      # `no such command: nextest`.
      - uses: taiki-e/install-action@nextest
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
      # macOS runner images do NOT ship tmux (actions/runner-images macos-15
      # README) — without installing it here the macOS leg is vacuously green:
      # `can_run_tripwire()` is false and every TUI tripwire SKIPs.
      - name: Install tmux (apt-get on Linux, brew on macOS)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Build hangar daemon binary
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo build -p ainb-hangar-daemon --bin ainb-hangar-daemon
        working-directory: ${{ env.WORKING_DIR }}
      - name: Build ainb binary
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo build -p ainb --bin ainb
        working-directory: ${{ env.WORKING_DIR }}
      - name: Stage bundled plugins (incl. hangar-tui)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: bash scripts/build-plugins.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: CI-lint — assert ci.yml hangar-e2e contract
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: cargo xtask ci-lint
        working-directory: ${{ env.WORKING_DIR }}
      # NOT a workspace clippy gate. `xtask/src/ci_lint.rs` documents why one
      # does not exist: the workspace carries heavy pre-existing clippy debt and
      # `-D warnings` would red CI for unrelated reasons. This denies exactly ONE
      # lint and leaves every other finding a warning.
      #
      # The lint is `await_holding_invalid_type`, configured in `ainb-tui/
      # clippy.toml` to reject a `tracing` `Entered` span guard held across an
      # `.await`. `Entered` is `Send` (unlike `EnteredSpan`), so the mistake
      # compiles; the guard is then dropped on whichever worker resumed the task,
      # the entering worker keeps the span id on its stack forever, and the next
      # contextual span opened there clones a closed span. That returns a slot to
      # the subscriber registry's pool with a live ref count, and the next
      # `new_span` ANYWHERE trips its refcount assertion, killing whatever task
      # opened it. That is what made `rpc_acp` fail intermittently on this job:
      # the victim was an RPC connection handler, so the test saw a closed socket
      # thousands of lines away from the cause.
      - name: No tracing span guard held across an await
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: >
          cargo clippy -p ainb-hangar-daemon -p ainb-acp --lib
          -- -D clippy::await_holding_invalid_type
        working-directory: ${{ env.WORKING_DIR }}
      - name: Run all hangar tripwires
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        # Hosted runners render the TUI much slower than a dev box, so the
        # dev-tuned tmux poll budgets time out under the full serial suite (a
        # runner-speed artifact, not a code fault). Widen every budget that
        # routes through `budget_scale()` here; single-run rigor is kept (a real
        # regression still fails at the scaled deadline).
        #
        # The Linux leg runs the FULL 68-tripwire matrix (authoritative — the
        # tmux tripwires exercise OS-agnostic render/protocol/daemon logic). The
        # macOS hosted runner is too small to finish all 68 heavy serial tmux
        # tripwires even at 3x budget (~4 random timeouts — runner capacity, not
        # a code fault), so the macOS leg runs a launch-smoke SUBSET that proves
        # the macOS-staged binaries actually launch + the basic stack works
        # (HANGAR_TRIPWIRE_SMOKE; see run_all_tripwires.sh). macOS-specific logic
        # (Seatbelt sandbox, orphan parent-death) is covered by the `test` +
        # `ainb-hooks` macOS legs and the macOS-gated crash/reconnect tripwire.
        env:
          HANGAR_TRIPWIRE_BUDGET_SCALE: "3"
          HANGAR_TRIPWIRE_SMOKE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: bash ../scripts/hangar/run_all_tripwires.sh
        working-directory: ${{ env.WORKING_DIR }}
      # The framed-socket + CLI acceptance proofs (rpc_*, migration_*_upgrade,
      # hangar_cli_integration, …) live in tests/ — neither the `--lib` test job
      # nor the tripwire suite runs them, so they were CI-ungated. Gate them here.
      - name: Run hangar acceptance tests (framed-socket + CLI)
        if: >-
          !cancelled() && (github.event_name != 'pull_request' ||
          needs.changes.outputs.relevant != 'false')
        run: bash ../scripts/hangar/run_acceptance_tests.sh
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # ainb-acp: the ACP client/reducer/writer library, its OWN named lane.
  #
  # `Test` already runs `--workspace`, so these tests do execute there. This
  # job exists for ATTRIBUTION, the same reason `Contracts` exists: an ACP
  # failure gets its own red check instead of being one line among thousands,
  # and the plan's verify-by-forced-failure step has a lane to point at.
  #
  # COUPLING: it also fires on `ainb-hangar-store/**` (the writer goes through
  # that crate's repo functions and a migration can break it without touching
  # a single ainb-acp file) and on `ainb-hangar-daemon/**` (Phase 5 hosts this
  # library in the daemon's pool).
  #
  # The real-adapter probes are `#[ignore]`d and NOT run here: the runners
  # have no `claude-agent-acp` / `codex-acp` and no credentials. Run them by
  # hand per the header of `crates/ainb-acp/tests/real_adapter.rs`.
  # ────────────────────────────────────────────────────────────────────────────
  acp:
    name: ainb-acp
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.acp != 'false')
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p ainb-acp --all-features --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Recording artifacts — a GATE, unlike the smoke lane below.
  #
  # Nine zero-byte GIFs reached main because a recorder failed silently and
  # nothing checked that a committed artifact carries bytes. A file existing is
  # not evidence. This is five seconds of CI that would have caught it.
  # ────────────────────────────────────────────────────────────────────────────
  recordings:
    name: Recording artifacts are not empty
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every committed recording carries bytes
        run: |
          empty="$(find explainers/recordings -type f -empty -print)"
          if [ -n "$empty" ]; then
            echo "::error::empty recording artifacts committed:"; echo "$empty"; exit 1
          fi
          echo "all recordings non-empty"
      - name: every file the outcomes contract names exists
        run: |
          missing=0
          for doc in $(find explainers/recordings -name EXPECTED-OUTCOMES.md); do
            dir="$(dirname "$doc")"
            # Filenames the contract references, as `name.ext` in backticks.
            for f in $(grep -oE '`[A-Za-z0-9._-]+\.(gif|mp4|png)`' "$doc" | tr -d '`' | sort -u); do
              [ -f "$dir/$f" ] || { echo "::error::$doc names $f, which does not exist"; missing=1; }
            done
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "every named artifact exists"

  # ────────────────────────────────────────────────────────────────────────────
  # Live chat-bus smoke — OPT-IN, same posture as the `#[ignore]`d real-adapter
  # probes.
  #
  # It boots a real hangar daemon, a private tmux server and real ACP adapter
  # processes, which is more than every PR should pay for; and unlike the unit
  # lanes a red run here can also mean "this runner has no tmux", so it is not
  # a gate. Ask for it by labelling a PR `chat-bus-smoke`, by setting the repo
  # variable AINB_CHAT_BUS_SMOKE=1, or by dispatching the workflow.
  # ────────────────────────────────────────────────────────────────────────────
  chat-bus-smoke:
    name: Chat bus live smoke (opt-in)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.AINB_CHAT_BUS_SMOKE == '1' ||
      contains(github.event.pull_request.labels.*.name, 'chat-bus-smoke')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Install the harness's tools
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux jq sqlite3
      # Journeys print `SMOKE-RESULT <journey> <PASS|FAIL|SKIP> <reason>`; the
      # script exits non-zero if any journey FAILs. A SKIP (for example the
      # resume journey against a daemon without Phase 6) keeps the lane green
      # and says so in the log.
      - name: Live chat-bus smoke
        run: bash scripts/chat-bus-smoke.sh
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Unused dependency detection
  # ────────────────────────────────────────────────────────────────────────────
  machete:
    name: Cargo Machete
    needs: changes
    if: >-
      !cancelled() && (github.event_name != 'pull_request' ||
      needs.changes.outputs.relevant != 'false')
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main
        with:
          manifest-path: ainb-tui/Cargo.toml
