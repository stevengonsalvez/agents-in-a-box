name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "plugins/ainb-hooks/**"
      - "plugins/hangar-tui/**"
      - "scripts/hangar/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "plugins/ainb-hooks/**"
      - "plugins/hangar-tui/**"
      - "scripts/hangar/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: ainb-tui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Format check
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Tests — cross-platform with nextest
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - uses: taiki-e/install-action@nextest
      - run: "cargo nextest run --lib --all-features --no-fail-fast -- --skip docker:: --skip cli::run::tests::test_validate_provider_installed_claude --skip models::usage::tests::custom_ranges_are_inclusive"
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # ainb-hooks daemon + plugin integration tests
  # ────────────────────────────────────────────────────────────────────────────
  ainb-hooks:
    name: ainb-hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Install tmux (Linux only; macOS runner ships it)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - name: Verify hook script parses on the runner
        run: bash -n plugins/ainb-hooks/hooks/notify.sh
      - name: Build + lib tests (ainb-plugin-notifyd)
        run: cargo test -p ainb-plugin-notifyd --lib --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: End-to-end hook → socket → SQLite
        run: cargo test -p ainb-plugin-notifyd --test end_to_end --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Tripwire — Inbox screen open + render
        run: cargo test -p ainb --test tripwire_inbox_opens_and_renders --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Hangar control-plane end-to-end tripwires (P0-P9)
  #
  # Mirrors the `ainb-hooks` per-feature pattern: install tmux on Linux, build
  # the daemon binary + stage the bundled plugins, then run every hangar
  # `tripwire_*` via scripts/hangar/run_all_tripwires.sh on BOTH target OSes.
  # No `cargo clippy -D warnings` gate here — the workspace carries pre-existing
  # clippy debt and CI gates on `cargo fmt --check` only (see `fmt` job).
  # ────────────────────────────────────────────────────────────────────────────
  hangar-e2e:
    name: hangar-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Install tmux (Linux only; macOS runner ships it)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Build hangar daemon binary
        run: cargo build -p ainb-hangar-daemon --bin ainb-hangar-daemon
        working-directory: ${{ env.WORKING_DIR }}
      - name: Build ainb binary
        run: cargo build -p ainb --bin ainb
        working-directory: ${{ env.WORKING_DIR }}
      - name: Stage bundled plugins (incl. hangar-tui)
        run: bash scripts/build-plugins.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: CI-lint — assert ci.yml hangar-e2e contract
        run: cargo xtask ci-lint
        working-directory: ${{ env.WORKING_DIR }}
      - name: Run all hangar tripwires
        run: bash ../scripts/hangar/run_all_tripwires.sh
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Unused dependency detection
  # ────────────────────────────────────────────────────────────────────────────
  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main
        with:
          manifest-path: ainb-tui/Cargo.toml
