name: CI

on:
  push:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "plugins/ainb-hooks/**"
      - "ainb-tui/crates/ainb-plugin-hangar/**"
      - "scripts/hangar/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "ainb-tui/**"
      - "plugins/ainb-hooks/**"
      - "ainb-tui/crates/ainb-plugin-hangar/**"
      - "scripts/hangar/**"
      - "Cargo.*"
      - ".github/workflows/ci.yml"

env:
  CARGO_TERM_COLOR: always
  WORKING_DIR: ainb-tui
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Format check
  # ────────────────────────────────────────────────────────────────────────────
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # CLI reference freshness — docs/tui/cli.md is generated from `ainb --help`.
  # Fails if it drifts, so the binary stays the single source of truth.
  # ────────────────────────────────────────────────────────────────────────────
  cli-docs:
    name: CLI reference freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Build ainb
        run: cargo build -p ainb
        working-directory: ${{ env.WORKING_DIR }}
      - name: Regenerate CLI reference from the binary
        run: AINB_BIN=target/debug/ainb bash scripts/gen-cli-reference.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: Assert docs/tui/cli.md is up to date
        run: |
          if ! git diff --exit-code -- docs/tui/cli.md; then
            echo "::error::docs/tui/cli.md is stale — run ainb-tui/scripts/gen-cli-reference.sh and commit the result." >&2
            exit 1
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # Tests — cross-platform with nextest
  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - uses: taiki-e/install-action@nextest
      # `--lib` alone builds ONLY in-source `#[cfg(test)]` modules, so every
      # integration target under `crates/*/tests/` was invisible here: whole test
      # files could be added — or stop compiling — without any job noticing.
      # `--tests` includes them.
      #
      # The `tripwire_*` binaries are excluded: they drive a real `ainb tui`
      # under tmux against staged plugins, which this job deliberately does not
      # provision (the hangar ones are the `hangar-e2e` job's authoritative
      # matrix; the `ainb` ones are launched by `ainb-hooks` / their own steps).
      # Running them here fails on the missing harness, not on the code. Every
      # other integration target now runs.
      #
      # The former trailing `-- --skip …` args are dropped: nextest does not
      # implement libtest's `--skip`, and a list-diff proves they filtered
      # nothing (identical test set with and without them). Removing them changes
      # no behaviour, it just stops the command claiming a skip it never made.
      - run: "cargo nextest run --lib --tests --all-features --no-fail-fast -E 'not binary(/^tripwire_/)'"
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # ainb-hooks daemon + plugin integration tests
  # ────────────────────────────────────────────────────────────────────────────
  ainb-hooks:
    name: ainb-hooks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      - name: Install tmux (Linux only; macOS runner ships it)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - name: Verify hook script parses on the runner
        run: bash -n plugins/ainb-hooks/hooks/notify.sh
      - name: Build + lib tests (ainb-plugin-notifyd)
        run: cargo test -p ainb-plugin-notifyd --lib --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: End-to-end hook → socket → SQLite
        run: cargo test -p ainb-plugin-notifyd --test end_to_end --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Tripwire — Inbox screen open + render
        run: cargo test -p ainb --test tripwire_inbox_opens_and_renders --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}
      - name: Sandbox script safety guards (rm -rf belts)
        run: cargo test -p ainb --test sandbox_script_safety_guards --no-fail-fast
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Hangar control-plane end-to-end tripwires (P0-P9)
  #
  # Mirrors the `ainb-hooks` per-feature pattern: install tmux on Linux, build
  # the daemon binary + stage the bundled plugins, then run every hangar
  # `tripwire_*` via scripts/hangar/run_all_tripwires.sh on BOTH target OSes.
  # No `cargo clippy -D warnings` gate here — the workspace carries pre-existing
  # clippy debt and CI gates on `cargo fmt --check` only (see `fmt` job).
  # ────────────────────────────────────────────────────────────────────────────
  hangar-e2e:
    name: hangar-e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ainb-tui -> target"
      # macOS runner images do NOT ship tmux (actions/runner-images macos-15
      # README) — without installing it here the macOS leg is vacuously green:
      # `can_run_tripwire()` is false and every TUI tripwire SKIPs.
      - name: Install tmux (apt-get on Linux, brew on macOS)
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y tmux
          else
            brew install tmux
          fi
      - name: Build hangar daemon binary
        run: cargo build -p ainb-hangar-daemon --bin ainb-hangar-daemon
        working-directory: ${{ env.WORKING_DIR }}
      - name: Build ainb binary
        run: cargo build -p ainb --bin ainb
        working-directory: ${{ env.WORKING_DIR }}
      - name: Stage bundled plugins (incl. hangar-tui)
        run: bash scripts/build-plugins.sh
        working-directory: ${{ env.WORKING_DIR }}
      - name: CI-lint — assert ci.yml hangar-e2e contract
        run: cargo xtask ci-lint
        working-directory: ${{ env.WORKING_DIR }}
      - name: Run all hangar tripwires
        # Hosted runners render the TUI much slower than a dev box, so the
        # dev-tuned tmux poll budgets time out under the full serial suite (a
        # runner-speed artifact, not a code fault). Widen every budget that
        # routes through `budget_scale()` here; single-run rigor is kept (a real
        # regression still fails at the scaled deadline).
        #
        # The Linux leg runs the FULL 34-tripwire matrix (authoritative — the
        # tmux tripwires exercise OS-agnostic render/protocol/daemon logic). The
        # macOS hosted runner is too small to finish all 34 heavy serial tmux
        # tripwires even at 3x budget (~4 random timeouts — runner capacity, not
        # a code fault), so the macOS leg runs a launch-smoke SUBSET that proves
        # the macOS-staged binaries actually launch + the basic stack works
        # (HANGAR_TRIPWIRE_SMOKE; see run_all_tripwires.sh). macOS-specific logic
        # (Seatbelt sandbox, orphan parent-death) is covered by the `test` +
        # `ainb-hooks` macOS legs and the macOS-gated crash/reconnect tripwire.
        env:
          HANGAR_TRIPWIRE_BUDGET_SCALE: "3"
          HANGAR_TRIPWIRE_SMOKE: ${{ matrix.os == 'macos-latest' && '1' || '' }}
        run: bash ../scripts/hangar/run_all_tripwires.sh
        working-directory: ${{ env.WORKING_DIR }}
      # The framed-socket + CLI acceptance proofs (rpc_*, migration_*_upgrade,
      # hangar_cli_integration, …) live in tests/ — neither the `--lib` test job
      # nor the tripwire suite runs them, so they were CI-ungated. Gate them here.
      - name: Run hangar acceptance tests (framed-socket + CLI)
        run: bash ../scripts/hangar/run_acceptance_tests.sh
        working-directory: ${{ env.WORKING_DIR }}

  # ────────────────────────────────────────────────────────────────────────────
  # Unused dependency detection
  # ────────────────────────────────────────────────────────────────────────────
  machete:
    name: Cargo Machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: bnjbvr/cargo-machete@main
        with:
          manifest-path: ainb-tui/Cargo.toml
