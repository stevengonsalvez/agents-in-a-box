name: Skill Manager & Catalog CI

# The curated skills/installer/catalog moved out of this monorepo into the
# standalone stevengonsalvez/ainb-toolkit repo. This workflow validates the
# ainb skill-manager (which consumes ainb-toolkit as a pinned external source)
# and cross-checks the embedded agent templates against a fetched ainb-toolkit
# checkout. The old toolkit/ structure-validation jobs were retired with the
# folder.

on:
  push:
    paths:
      - 'ainb-tui/**'
      - '.github/workflows/toolkit-validation.yml'
  pull_request:
    paths:
      - 'ainb-tui/**'
      - '.github/workflows/toolkit-validation.yml'

# The pinned ainb-toolkit ref this build of ainb consumes. Keep in lockstep
# with release.yml's AINB_TOOLKIT_REF.
env:
  AINB_TOOLKIT_REF: v1.6.0

jobs:
  validate-template-skill-refs:
    name: Validate template skill refs against ainb-toolkit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ainb-tui

      - name: Clone pinned ainb-toolkit
        run: |
          git clone --depth 1 --branch "${AINB_TOOLKIT_REF}" \
            https://github.com/stevengonsalvez/ainb-toolkit.git \
            "${{ github.workspace }}/ainb-toolkit"

      - name: Enforce every embedded template skill resolves in ainb-toolkit
        env:
          # The runtime mirror test enforces existence (instead of skipping)
          # when this points at a real ainb-toolkit skills/ dir.
          AINB_TOOLKIT_SKILLS_DIR: ${{ github.workspace }}/ainb-toolkit/skills
        run: |
          cd ainb-tui
          cargo test -p ainb-hangar-core --test template_registry_tests -- --nocapture

      - name: Generate catalog index from the pinned ainb-toolkit (sanity)
        run: |
          cd ainb-tui
          cargo run -p xtask -- gen-catalog-index \
            --toolkit-root "${{ github.workspace }}/ainb-toolkit" \
            --release-tag "${AINB_TOOLKIT_REF}" \
            --out "${RUNNER_TEMP}/catalog-index.json"
          # Owned URIs must pin the cloned ainb-toolkit ref.
          grep -q "gh:stevengonsalvez/ainb-toolkit@${AINB_TOOLKIT_REF}/skills/" \
            "${RUNNER_TEMP}/catalog-index.json" \
            || (echo "ERROR: owned install_uris do not pin ainb-toolkit@${AINB_TOOLKIT_REF}"; exit 1)
          echo "✓ catalog-index owned URIs pin ainb-toolkit@${AINB_TOOLKIT_REF}"

  test-ainb-installations:
    name: Test ainb installations (replaces bootstrap.js parity tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ainb-tui

      - name: Install tmux (required by TUI tripwires)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run skill-manager unit + integration test suite
        run: |
          cd ainb-tui
          cargo test --no-fail-fast \
            -p ainb-skill-core \
            -p ainb-fetch \
            -p ainb-adapters-source \
            -p ainb-adapters-tool \
            -p ainb-diff \
            -p ainb-cli \
            -p ainb-usage

      - name: Run live-binary tripwires (Layer 4)
        run: |
          cd ainb-tui
          # Release-build the binary so tripwires get a fast spawn time.
          cargo build --release -p ainb

          # CLI tripwires run without tmux; TUI tripwires self-skip when
          # tmux is missing (sudo-installed step above ensures it's
          # present on this runner). Both groups must be green.
          #
          # Naming convention: `tripwire_<area>_<feature>_*` where area is
          # one of {cli, core, plugin}. `tripwire_helpers.rs` is the shared
          # module (not a test) and is excluded by the prefix scheme.
          cargo test -p ainb --release \
              --test 'tripwire_cli_*' \
              --test 'tripwire_core_skill_manager_*' \
              --test 'tripwire_core_home_tile_lists_skill_manager'

      - name: "Smoke test: AINB_USE_REAL_HOMES wiring with a tempdir HOME"
        run: |
          cd ainb-tui
          BIN="$PWD/target/release/ainb"

          # Pretend HOME is a clean tempdir so the real-home tier
          # writes into it instead of the runner's actual home.
          export HOME="$RUNNER_TEMP/fake-home"
          export AINB_HOME="$RUNNER_TEMP/ainb-home"
          export AINB_USE_REAL_HOMES=1
          mkdir -p "$HOME" "$AINB_HOME"

          # Build a local fixture source.
          mkdir -p "$RUNNER_TEMP/fixture/skills/commit"
          cat > "$RUNNER_TEMP/fixture/skills/commit/SKILL.md" <<'SKILL'
          ---
          name: commit
          description: commit-message skill (CI fixture)
          ---
          body
          SKILL

          "$BIN" source add "local:$RUNNER_TEMP/fixture" --name fixture
          "$BIN" skill install "local:$RUNNER_TEMP/fixture@main/skills/commit" \
              --targets claude --yes

          # Verify the file landed in the real-home path.
          test -f "$HOME/.claude/skills/commit/SKILL.md" \
              || (echo "ERROR: missing deployed file"; exit 1)
          echo "✓ ainb skill install reaches HOME/.claude when AINB_USE_REAL_HOMES=1"

          # Doctor against the just-installed state.
          "$BIN" doctor --offline
