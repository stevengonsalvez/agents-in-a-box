name: Toolkit Validation

on:
  push:
    paths:
      - 'toolkit/**'
      - 'ainb-tui/**'
      - '.github/workflows/toolkit-validation.yml'
  pull_request:
    paths:
      - 'toolkit/**'
      - 'ainb-tui/**'
      - '.github/workflows/toolkit-validation.yml'

jobs:
  validate-packages:
    name: Validate Packages Structure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate package structure
        run: |
          cd toolkit

          echo "=== Checking packages/ structure ==="

          # Required directories
          for dir in agents skills workflows utilities; do
            if [ ! -d "packages/$dir" ]; then
              echo "ERROR: Missing required directory: packages/$dir"
              exit 1
            fi
            echo "✓ packages/$dir exists"
          done

          # Count files
          AGENT_COUNT=$(find packages/agents -name "*.md" | wc -l)
          SKILL_COUNT=$(find packages/skills -mindepth 2 -name "SKILL.md" | wc -l)

          echo ""
          echo "File counts:"
          echo "  Agents:    $AGENT_COUNT"
          echo "  Skills:    $SKILL_COUNT"

          # Minimum thresholds. Commands have been consolidated into skills,
          # so we no longer count a separate commands/ tree.
          [ "$AGENT_COUNT" -lt 30 ] && echo "WARNING: Agent count seems low" && exit 1
          [ "$SKILL_COUNT" -lt 60 ] && echo "WARNING: Skill count seems low" && exit 1

          echo "✓ Package structure validated"

  test-ainb-installations:
    name: Test ainb installations (replaces bootstrap.js parity tests)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo state
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ainb-tui

      - name: Install tmux (required by TUI tripwires)
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Run skill-manager unit + integration test suite
        run: |
          cd ainb-tui
          cargo test --workspace --no-fail-fast \
            -p ainb-skill-core \
            -p ainb-fetch \
            -p ainb-adapters-source \
            -p ainb-adapters-tool \
            -p ainb-diff \
            -p ainb-cli \
            -p ainb-usage

      - name: Run live-binary tripwires (Layer 4)
        run: |
          cd ainb-tui
          # Release-build the binary so tripwires get a fast spawn time.
          cargo build --release -p ainb

          # CLI tripwires run without tmux; TUI tripwires self-skip when
          # tmux is missing (sudo-installed step above ensures it's
          # present on this runner). Both groups must be green.
          cargo test -p ainb --release \
              --test 'tripwire_cli_*' \
              --test 'tripwire_skill_manager_*' \
              --test 'tripwire_home_tile_lists_skill_manager'

      - name: Smoke test: AINB_USE_REAL_HOMES wiring with a tempdir HOME
        run: |
          cd ainb-tui
          BIN="$PWD/target/release/ainb"

          # Pretend HOME is a clean tempdir so the real-home tier
          # writes into it instead of the runner's actual home.
          export HOME="$RUNNER_TEMP/fake-home"
          export AINB_HOME="$RUNNER_TEMP/ainb-home"
          export AINB_USE_REAL_HOMES=1
          mkdir -p "$HOME" "$AINB_HOME"

          # Build a local fixture source.
          mkdir -p "$RUNNER_TEMP/fixture/skills/commit"
          cat > "$RUNNER_TEMP/fixture/skills/commit/SKILL.md" <<'SKILL'
          ---
          name: commit
          description: commit-message skill (CI fixture)
          ---
          body
          SKILL

          "$BIN" source add "local:$RUNNER_TEMP/fixture" --name fixture
          "$BIN" skill install "local:$RUNNER_TEMP/fixture@main/skills/commit" \
              --targets claude --yes

          # Verify the file landed in the real-home path.
          test -f "$HOME/.claude/skills/commit/SKILL.md" \
              || (echo "ERROR: missing deployed file"; exit 1)
          echo "✓ ainb skill install reaches HOME/.claude when AINB_USE_REAL_HOMES=1"

          # Doctor against the just-installed state.
          "$BIN" doctor --offline

  check-claude-code-thin-layer:
    name: Verify claude-code-4.5 is thin layer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check claude-code-4.5 structure
        run: |
          cd toolkit/claude-code-4.5

          echo "=== Checking claude-code-4.5 is a thin layer ==="

          # Should only have these files
          ALLOWED_FILES="CLAUDE.md settings.json settings.local.json .gitignore"
          ALLOWED_DIRS="session logs"

          # Check for unexpected directories (agents, commands, etc should NOT exist)
          for dir in agents commands hooks skills templates utils orchestration output-styles reflections; do
            if [ -d "$dir" ]; then
              echo "ERROR: claude-code-4.5/$dir should not exist (content is in packages/)"
              exit 1
            fi
          done

          # Verify required files exist
          [ ! -f "CLAUDE.md" ] && echo "ERROR: CLAUDE.md missing" && exit 1
          [ ! -f "settings.json" ] && echo "ERROR: settings.json missing" && exit 1

          echo "✓ claude-code-4.5 is correctly structured as a thin layer"
