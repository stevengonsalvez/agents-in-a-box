name: Desktop

# The desktop shell (ainb-tui/crates/ainb-desktop) is its own cargo workspace,
# excluded from ainb-tui's members, so no job in ci.yml builds Tauri or needs
# the platform webview. This workflow is its gate: fmt, clippy on the window
# build, the headless host contract, and the sidecar supervisor against the real
# hangar daemon, on both runners.
on:
  push:
    branches: [main, v2]
    paths:
      - "ainb-tui/crates/ainb-desktop/**"
      - "ainb-tui/crates/ainb-app/**"
      - "ainb-tui/crates/ainb-hangar-*/**"
      - "ainb-tui/xtask/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    branches: [main, v2]
    paths:
      - "ainb-tui/crates/ainb-desktop/**"
      - "ainb-tui/crates/ainb-app/**"
      - "ainb-tui/crates/ainb-hangar-*/**"
      - "ainb-tui/xtask/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  # Which leg the macOS journey runs, declared rather than discovered. It is
  # the substitute until the DOM journey has actually passed on a macOS runner:
  # the journey has only ever been run on Linux, so claiming the other leg
  # would be switching on a leg nobody has seen. The job's "Record which e2e
  # leg ran" step names whichever ran and fails if neither did.
  MACOS_E2E_LEG: substitute

jobs:
  desktop:
    name: Desktop shell (${{ matrix.os }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ainb-tui -> target
            ainb-tui/crates/ainb-desktop -> target
      - name: Install the Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf tmux
      # The terminal tab tests attach real tmux clients on a private socket.
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ainb-tui/crates/ainb-desktop/ui/package-lock.json
      # The window build embeds `ui/dist`, and `tsc --noEmit --strict` runs first.
      - name: Build the shell frontend
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ainb-tui/crates/ainb-desktop/ui
      # The frame store's D15 invariants and the sidebar's ring projection.
      - name: Frontend store tests
        run: npm test
        working-directory: ainb-tui/crates/ainb-desktop/ui
      # Builds the daemon the sidecar tests run and stages it for
      # `bundle.externalBin`, which the window build checks for.
      - name: Stage the hangar daemon sidecar
        run: cargo xtask stage-desktop-sidecar
        working-directory: ainb-tui
      - name: Format
        run: cargo fmt -- --check
        working-directory: ainb-tui/crates/ainb-desktop
      - name: Clippy (library, tests and the window build)
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: ainb-tui/crates/ainb-desktop
      - name: Host contract and sidecar tests
        run: cargo test
        working-directory: ainb-tui/crates/ainb-desktop
        env:
          AINB_CODEX_MANAGED: "0"
      # The two shapes that cross the IPC seam are generated, not hand-written,
      # so renaming a variant or a field in Rust cannot leave the window
      # compiling and wrong (#1158). The feature is off in every normal build.
      - name: Assert bindings/Desktop.ts is up to date
        run: cargo test --features typescript-bindings --test bindings
        working-directory: ainb-tui/crates/ainb-desktop

  # The DOM journey: the shell launched for real, driving a real daemon and
  # real tmux sessions in a private world. The app under test is a debug build
  # with the `wdio` feature on, which carries the embedded WebDriver; the
  # `bundle` job below asserts the release binary carries none.
  e2e:
    name: Desktop journey (${{ matrix.os }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ainb-tui -> target
            ainb-tui/crates/ainb-desktop -> target
      - name: Install the Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf tmux xvfb
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ainb-tui/crates/ainb-desktop/ui/package-lock.json
      - name: Build the shell frontend
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ainb-tui/crates/ainb-desktop/ui
      # The world seeds its sessions with this CLI, and the journey creates one
      # more from it while the window is open.
      - name: Build the ainb CLI and the hangar daemon
        run: cargo build --bin ainb --bin ainb-hangar-daemon
        working-directory: ainb-tui
      # The window build reads `bundle.externalBin`, so the sidecar has to be
      # staged beside it first, exactly as the other two jobs do.
      - name: Stage the hangar daemon sidecar
        run: cargo xtask stage-desktop-sidecar
        working-directory: ainb-tui
      - name: Build the shell with the embedded WebDriver
        run: cargo build --features wdio
        working-directory: ainb-tui/crates/ainb-desktop
      - name: Install the journey's runner
        run: npm ci --no-audit --no-fund
        working-directory: ainb-tui/crates/ainb-desktop/e2e
        env:
          # Hard dependencies of @wdio/utils whose install scripts fetch
          # browser drivers this journey never uses; esbuild's own script is
          # still needed, so this is not --ignore-scripts.
          GECKODRIVER_SKIP_DOWNLOAD: "true"
          EDGEDRIVER_SKIP_DOWNLOAD: "true"
      - name: Desktop journey (Linux, under xvfb)
        id: journey_linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
        working-directory: ainb-tui/crates/ainb-desktop/e2e
        env:
          AINB_DESKTOP_BIN: ${{ github.workspace }}/ainb-tui/crates/ainb-desktop/target/debug/ainb-desktop
          AINB_BIN: ${{ github.workspace }}/ainb-tui/target/debug/ainb
          AINB_DESKTOP_DAEMON_BIN: ${{ github.workspace }}/ainb-tui/target/debug/ainb-hangar-daemon
      - name: Desktop journey (macOS)
        id: journey_macos
        if: runner.os == 'macOS' && env.MACOS_E2E_LEG == 'journey'
        run: npm test
        working-directory: ainb-tui/crates/ainb-desktop/e2e
        env:
          AINB_DESKTOP_BIN: ${{ github.workspace }}/ainb-tui/crates/ainb-desktop/target/debug/ainb-desktop
          AINB_BIN: ${{ github.workspace }}/ainb-tui/target/debug/ainb
          AINB_DESKTOP_DAEMON_BIN: ${{ github.workspace }}/ainb-tui/target/debug/ainb-hangar-daemon
      # The recorded substitute, run only when MACOS_E2E_LEG says so: the Rust
      # host contract and sidecar tests, with the bundle smoke in its own job.
      - name: The macOS substitute for the journey
        id: substitute_macos
        if: runner.os == 'macOS' && env.MACOS_E2E_LEG != 'journey'
        run: cargo test
        working-directory: ainb-tui/crates/ainb-desktop
        env:
          AINB_CODEX_MANAGED: "0"
      # Which leg ran is a job outcome, never a silent pass: this step names it
      # in the summary and fails if neither leg reported one.
      - name: Record which e2e leg ran
        if: always()
        run: |
          set -euo pipefail
          leg="none"
          outcome="none"
          if [ "${{ runner.os }}" = "Linux" ]; then
            leg="journey (Linux, xvfb)"
            outcome="${{ steps.journey_linux.outcome }}"
          elif [ "${{ steps.journey_macos.outcome }}" != "" ] && [ "${{ steps.journey_macos.outcome }}" != "skipped" ]; then
            leg="journey (macOS)"
            outcome="${{ steps.journey_macos.outcome }}"
          elif [ "${{ steps.substitute_macos.outcome }}" != "" ] && [ "${{ steps.substitute_macos.outcome }}" != "skipped" ]; then
            leg="substitute (host contract and sidecar tests; the DOM journey is Linux only)"
            outcome="${{ steps.substitute_macos.outcome }}"
          fi
          echo "e2e leg on ${{ matrix.os }}: $leg ($outcome)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$outcome" = "success"
      # The 50 MiB figure is recorded, never a pass condition (spec :368).
      - name: Upload the throughput figure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-throughput-${{ matrix.os }}
          path: ainb-tui/crates/ainb-desktop/e2e/throughput.json
          if-no-files-found: warn
      # What the review tab costs a real window at the frame's bound: rows,
      # DOM nodes, first render and redraw (#1221). Recorded like the
      # throughput figure, never a pass condition; the journey's own
      # assertions are what pass or fail.
      - name: Upload the review render figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-review-render-${{ matrix.os }}
          path: ainb-tui/crates/ainb-desktop/e2e/review-render.json
          if-no-files-found: warn

  # The release bundle carries no WebDriver: the `wdio` feature is off, so the
  # binary exports no driver symbol, holds no plugin string and binds no port.
  bundle:
    name: Bundle smoke (${{ matrix.os }})
    timeout-minutes: 90
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ainb-tui -> target
            ainb-tui/crates/ainb-desktop -> target
      - name: Install the Tauri system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf binutils xvfb
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ainb-tui/crates/ainb-desktop/ui/package-lock.json
      - name: Build the shell frontend
        run: npm ci --no-audit --no-fund && npm run build
        working-directory: ainb-tui/crates/ainb-desktop/ui
      - name: Stage the hangar daemon sidecar
        run: cargo xtask stage-desktop-sidecar --release
        working-directory: ainb-tui
      # The same pinned CLI the release workflow bundles with, so a bundle this
      # job proves is the bundle a release would ship.
      - name: Install the Tauri CLI (pinned)
        run: |
          if cargo tauri --version 2>/dev/null | grep -q "tauri-cli ${TAURI_CLI_VERSION}"; then
            echo "tauri-cli ${TAURI_CLI_VERSION} already installed"
          else
            cargo install tauri-cli --version "${TAURI_CLI_VERSION}" --locked
          fi
          cargo tauri --version
        env:
          TAURI_CLI_VERSION: "2.11.4"
      # `bundled` serves `ui/dist` over the window's own protocol, which is what
      # a shipped build does; it does not pull the WebDriver in. The bundler
      # builds the same `target/release/ainb-desktop` the checks below read and
      # wraps it, with the staged sidecar, into the platform's bundle.
      - name: Build the release shell and its bundle
        run: cargo tauri build --features bundled --bundles ${{ runner.os == 'macOS' && 'app' || 'appimage' }} -- --locked
        working-directory: ainb-tui/crates/ainb-desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      # Run this exact block against any release build to check it yourself.
      - name: No WebDriver symbol or plugin string in the release binary
        run: |
          set -euo pipefail
          # On macOS the copy inside the bundle is what ships, so that is the
          # binary read; on Linux the AppImage wraps the same file.
          BIN=target/release/ainb-desktop
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
            BIN="$APP/Contents/MacOS/ainb-desktop"
          fi
          echo "binary under test: $BIN"
          test -x "$BIN"
          # Each tool's output is kept and asserted non-empty first: a stripped
          # binary would otherwise pass by telling us nothing. An `! pipeline`
          # never trips errexit, so each guard fails the step itself.
          nm -a "$BIN" > symbols.txt 2>/dev/null || true
          test -s symbols.txt
          if grep -i -e wdio_webdriver -e tauri_plugin_wdio symbols.txt; then
            echo "the release binary exports a WebDriver symbol" >&2
            exit 1
          fi
          strings -a "$BIN" > strings.txt
          test -s strings.txt
          if grep -i -e tauri-plugin-wdio -e wdio-webdriver strings.txt; then
            echo "the release binary names the WebDriver plugin" >&2
            exit 1
          fi
          echo "the release binary exports no WebDriver symbol and names no driver plugin"
        working-directory: ainb-tui/crates/ainb-desktop
      # The other half of the same claim: the running window owns no listener.
      - name: The release shell binds no driver port (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          BIN=target/release/ainb-desktop
          HOME_DIR="$(mktemp -d)"
          HOME="$HOME_DIR" AINB_HANGAR_HOME="$HOME_DIR/.agents-in-a-box" \
            xvfb-run -a "$BIN" &
          runner=$!
          sleep 20
          # The window is the child of xvfb-run, so the pid to ask about is the
          # binary's own. It is matched by process name: the cmdline carries
          # the path exactly as it was passed, which is relative, so an
          # absolute pattern matches nothing.
          app="$(pgrep -x ainb-desktop | head -1 || true)"
          if [ -z "$app" ]; then
            echo "no release shell was running 20 s after launch" >&2
            ps -o pid,args -u "$(id -u)" >&2
            kill "$runner" || true
            exit 1
          fi
          # Printed before the checks, so a failing step is never silent about
          # which process it asked about.
          echo "release shell pid $app: $(tr '\0' ' ' < "/proc/$app/cmdline")"
          # A crashed app owns no listener either, so it has to still be alive.
          kill -0 "$app"
          if ss -ltnp 2>/dev/null | grep -q "pid=$app,"; then
            echo "the release shell is listening on a port of its own" >&2
            ss -ltnp | grep "pid=$app," >&2
            kill "$app" || true
            kill "$runner" || true
            exit 1
          fi
          kill "$app" || true
          kill "$runner" || true
          echo "the running release shell owns no listener"
        working-directory: ainb-tui/crates/ainb-desktop
      # The bundle itself, not only the binary inside it. On Linux the AppImage
      # is run the way the block above runs the binary: alive after 20 s, no
      # listener, the sidecar reachable beside the app binary inside it.
      - name: The AppImage runs and binds no port (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          APPIMAGE="$(find target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -x "$APPIMAGE"
          echo "bundle: $APPIMAGE"
          HOME_DIR="$(mktemp -d)"
          HOME="$HOME_DIR" AINB_HANGAR_HOME="$HOME_DIR/.agents-in-a-box" APPIMAGE_EXTRACT_AND_RUN=1 \
            xvfb-run -a "$APPIMAGE" &
          runner=$!
          sleep 20
          app="$(pgrep -x ainb-desktop | head -1 || true)"
          if [ -z "$app" ]; then
            echo "no shell was running 20 s after launching the AppImage" >&2
            ps -o pid,args -u "$(id -u)" >&2
            kill "$runner" || true
            exit 1
          fi
          echo "AppImage shell pid $app: $(tr '\0' ' ' < "/proc/$app/cmdline")"
          kill -0 "$app"
          # The sidecar is beside the app binary inside the extracted image.
          exe_dir="$(dirname "$(readlink -f "/proc/$app/exe")")"
          test -x "$exe_dir/ainb-hangar-daemon"
          if ss -ltnp 2>/dev/null | grep -q "pid=$app,"; then
            echo "the AppImage shell is listening on a port of its own" >&2
            ss -ltnp | grep "pid=$app," >&2
            kill "$app" || true
            kill "$runner" || true
            exit 1
          fi
          kill "$app" || true
          kill "$runner" || true
          echo "the AppImage runs, carries its sidecar and owns no listener"
        working-directory: ainb-tui/crates/ainb-desktop
      # On macOS the bundle is read, never launched: a hosted macOS runner is
      # not a GUI host (the e2e job declares its substitute leg for the same
      # reason). Structure, version agreement between the app and the sidecar
      # inside it, and a valid signature; launching is the human rehearsal's.
      - name: The app bundle carries its sidecar at its own version (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          APP="$(find target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          test -d "$APP"
          echo "bundle: $APP"
          test -x "$APP/Contents/MacOS/ainb-desktop"
          test -x "$APP/Contents/MacOS/ainb-hangar-daemon"
          crate_version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          short="$(plutil -extract CFBundleShortVersionString raw "$APP/Contents/Info.plist")"
          test "$short" = "$crate_version"
          test "$(plutil -extract CFBundleIdentifier raw "$APP/Contents/Info.plist")" = "dev.agentsinabox.desktop"
          reported="$("$APP/Contents/MacOS/ainb-hangar-daemon" --version)"
          echo "sidecar reports: $reported"
          case "$reported" in
            *" $crate_version") ;;
            *) echo "the sidecar inside the bundle is not at the app's version $crate_version" >&2; exit 1 ;;
          esac
          codesign -v --strict --deep "$APP"
          echo "the app bundle is well formed, signed, and carries its sidecar at $crate_version"
        working-directory: ainb-tui/crates/ainb-desktop
