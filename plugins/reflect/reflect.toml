[storage]
db_path = "~/.reflect/reflect.db"
artifacts_dir = "docs/solutions"

[discovery]
enabled_providers = ["claude", "codex", "copilot", "gemini"]
staleness_days = 30

[providers.claude]
projects_dir = "~/.claude/projects"
# Scan every .md file under memory/ — the consolidated MEMORY.md index
# AND the atomic per-fact files (feedback_*.md, project_*.md, user_*.md,
# reference_*.md) that carry the rich content. Older versions narrowly
# matched MEMORY.md only and silently dropped every atomic file from the
# knowledge base (incident 2026-05-16).
memory_pattern = "*/memory/*.md"

[providers.codex]
home_dir = "~/.codex"
memories_dir = "~/.codex/memories"
agents_md = "~/.codex/AGENTS.md"

[providers.copilot]
home_dir = "~/.copilot"
agents_md = "~/.copilot/AGENTS.md"

[providers.gemini]
home_dir = "~/.gemini"
global_md = "~/.gemini/GEMINI.md"

[indexers.graphrag]
# Canonical CLI is `reflect` (from reflect-kb, installed via
# `uv tool install reflect-kb`). Resolved through $PATH so any install
# location works; the bare name is intentional. Override here only if you
# need to pin a specific binary.
cli_path = "reflect"
auto_sidecar = true

[policies]
auto_approve_threshold = 0.8
retention_days = 90
max_memory_lines = 200

[issues]
# `reflect issues` mode — distill recent transcripts into privacy-sanitized,
# deduplicated GitHub issues. Reuses the pending_reflections queue and
# REFLECT_STATE_DIR; nothing is filed until a candidate passes the privacy
# sanitizer, and `--dry-run` prints the exact bodies without calling `gh`.
#
#   repo          = target OWNER/NAME. Leave unset so `gh` infers it from cwd.
#   limit         = max recent transcripts to pull from the queue per run.
#   model         = analyzer model passed to `claude -p` (gated on Claude auth).
#   label         = provenance label on every filed issue (auto-created if the
#                   repo lacks it). Set "" to disable. Default: "reflect".
#   title_prefix  = stamped on every issue title so it's clearly reflect-filed.
#                   Set "" to disable. Default: "reflect: ".
# repo  = "owner/name"
limit = 20
model = "sonnet"
label = "reflect"
title_prefix = "reflect: "

[telemetry]
enabled = true
log_level = "info"
