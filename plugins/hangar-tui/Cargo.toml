[package]
name = "ainb-plugin-hangar"
version = "0.1.0"
# This crate lives outside the workspace root dir (`ainb-tui/`), so cargo
# can't discover the workspace by walking parent dirs — point at it
# explicitly so `*.workspace = true` inheritance resolves.
workspace = "../../ainb-tui"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Hangar control plane TUI — subprocess plugin (ABI v2)"
categories = ["command-line-utilities"]
keywords = ["ainb", "hangar", "plugin", "tui", "control-plane"]

[lib]
name = "ainb_plugin_hangar"
path = "src/lib.rs"

[[bin]]
name = "ainb-plugin-hangar"
path = "src/main.rs"

[dependencies]
ainb-plugin-sdk-rust = { path = "../../ainb-tui/crates/ainb-plugin-sdk-rust" }
ainb-hangar-proto = { path = "../../ainb-tui/crates/ainb-hangar-proto" }

tokio = { workspace = true }
async-trait = "0.1"
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
ainb-plugin-protocol = { path = "../../ainb-tui/crates/ainb-plugin-protocol" }
tempfile = { workspace = true }
toml = { workspace = true }

# Local lint config rather than `workspace = true`, mirroring the sibling
# ainb-hangar-* crates: the workspace-level lints declare lint groups at the
# same priority as specific lints (which rustc rejects), and the `cargo`
# clippy group would demand a `readme`. Replicate the intent locally so
# `cargo clippy -p ainb-plugin-hangar --all-targets -- -D warnings` stays
# clean while still enforcing pedantic + nursery.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_imports = "warn"
unused_variables = "warn"
dead_code = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
